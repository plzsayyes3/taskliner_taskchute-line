<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ebe8">
<title>TaskLiner V2 mobile preview</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:#e9ebe8}iframe{display:block;width:min(100vw,430px);height:100dvh;border:0;background:#f5f5f2;box-shadow:0 0 30px #00000018}@media(max-width:430px){iframe{width:100vw;box-shadow:none}}
</style>
<script src="./v2-preview.js?v=20260926"></script>
</head>
<body>
<iframe id="preview" title="TaskLiner mobile preview" aria-label="TaskLiner mobile preview"></iframe>
<script>
const raw='https://raw.githubusercontent.com/plzsayyes3/taskliner_taskchute-line/design/mobile-running-task-dock/';
const resources=['app.html','task-markdown.js?v=20260922-markdown','task-ui-actions.js?v=20260921-one-line'];
const previewRevision=Date.now();
Promise.all(resources.map(async path=>{const response=await fetch(TaskLinerV2Preview.previewAssetUrl(raw,path,previewRevision));if(!response.ok)throw new Error(`${path}: HTTP ${response.status}`);return response.text()})).then(([app,markdown,actions])=>{
  document.getElementById('preview').srcdoc=TaskLinerV2Preview.buildPreviewDocument(app,markdown,actions);
}).catch(error=>{
  document.body.innerHTML=`<p style="max-width:32rem;padding:2rem;font:16px/1.6 system-ui;color:#6b2525">プレビューを読み込めませんでした。ページを再読み込みしてください。<br><small>${String(error.message||error)}</small></p>`;
});
</script>
</body>
</html>
