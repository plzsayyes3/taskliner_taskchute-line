<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskLiner One-line UI Concept</title>
<style>
:root{--bg:#f5f6f3;--panel:#fff;--text:#202522;--muted:#7a817b;--line:#dfe3dc;--accent:#376254;--soft:#edf4f0;--danger:#a45353}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;padding-top:56px}
header{position:fixed;z-index:10;inset:0 0 auto;height:56px;background:#ffffffed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(12px,calc((100vw - 760px)/2))}.clock{font-weight:800;font-size:17px}.date{font-size:13px;font-weight:750}.progress{justify-self:end;color:var(--muted);font-size:11px;padding-right:44px}.menu{position:absolute;right:max(10px,calc((100vw - 760px)/2));top:10px;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:17px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:12px}.running{border:1px solid #b7cec2;background:var(--soft);border-radius:11px;padding:9px 11px;margin-bottom:13px}.running small{color:var(--muted);font-size:10px}.running strong{display:block;margin-top:3px;font-size:14px}.running .meta{margin-top:3px}
.section{margin:14px 2px 6px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.05em}.tasks{display:flex;flex-direction:column;gap:3px}.task{display:grid;grid-template-columns:23px minmax(0,1fr) auto;grid-template-areas:'mark info actions';align-items:center;gap:7px;min-height:42px;padding:6px 7px;border:1px solid transparent;border-radius:9px;background:transparent}.task:hover{background:#ffffff99}.task.selected{grid-template-columns:23px minmax(0,1fr);grid-template-areas:'mark info' 'mark actions';border-color:#b7cec2;background:var(--panel);box-shadow:0 2px 9px #1e30290b}.mark{grid-area:mark;width:22px;height:22px;border:1px solid #bfc7bf;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--panel)}.task>div:nth-child(2){grid-area:info;min-width:0}.task.done{opacity:.52}.task.done .title{text-decoration:line-through}.title{min-width:0;font-size:13px;font-weight:650;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:8px;color:var(--muted);font-size:10px;line-height:1.25}.meta .repeat{opacity:.48}.actions{grid-area:actions;display:flex;align-items:center;gap:3px}.task.selected .actions{padding-top:3px}.actions button{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--muted);font-size:12px;font-weight:750}.actions button:hover,.actions button.primary{border-color:var(--accent);background:var(--accent);color:#fff}.actions button.danger{color:var(--danger)}.task:not(.selected) .actions{display:none}.note{margin:18px auto;color:var(--muted);font-size:10px;max-width:760px;padding:0 12px}
.shade{display:none}.open .shade{display:block;position:fixed;z-index:20;inset:0;background:#18202433}.sheet{display:none}.open .sheet{display:block;position:fixed;z-index:21;top:0;left:0;right:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px max(14px,calc((100vw - 680px)/2)) 18px;box-shadow:0 14px 38px #18202422}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet-head button{border:0;background:transparent;font-size:22px;color:var(--muted)}.setting-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.setting{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;text-align:left;font-size:12px;color:var(--text)}.setting.on{border-color:#aac2b6;background:var(--soft)}.setting b{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:5px;border-radius:6px;background:#f0f2ee;color:var(--accent)}.setting small{display:block;color:var(--muted);font-size:9px;margin:4px 0 0 28px}.legend{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}
@media(max-width:600px){header{grid-template-columns:auto 1fr;padding:0 54px 0 10px}.date{justify-self:end}.progress{display:none}.menu{right:9px}.task{grid-template-columns:23px minmax(0,1fr) auto}.actions button{width:25px;height:25px}.setting-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="clock">18:27</div><div class="date">9月19日（土）</div><div class="progress">3/9 完了</div><button class="menu" id="menu" aria-label="表示設定">≡</button></header>
<main>
<section class="running"><small>実行中　経過 08m</small><strong>📖 資料を読む</strong><div class="meta">16:12 → 16:27　見積 15m</div></section>
<div class="section">7–9</div><div class="tasks">
<div class="task" data-task><div class="mark">○</div><div><div class="title">📝 今日のメモを整理する</div><div class="meta">10m</div></div><div class="actions"><button class="primary" title="開始">始</button><button title="翌日">翌</button><button title="その他">…</button></div></div>
<div class="task selected" data-task><div class="mark">○</div><div><div class="title">📨 メールを確認する</div><div class="meta">10m　<span class="repeat" title="繰り返し">↻</span>　メモ 1</div></div><div class="actions"><button class="primary" title="開始">始</button><button title="時刻指定">時</button><button title="保留">保</button><button title="その他">…</button></div></div>
</div>
<div class="section">9–19</div><div class="tasks">
<div class="task" data-task><div class="mark">○</div><div><div class="title">🚶 散歩する</div><div class="meta">20m　<span class="repeat" title="繰り返し">↻</span></div></div><div class="actions"><button class="primary" title="開始">始</button><button title="翌日">翌</button><button title="その他">…</button></div></div>
<div class="task done" data-task><div class="mark">✓</div><div><div class="title">☕ 休憩する</div><div class="meta">実績 10m</div></div><div class="actions"><button title="完了を戻す">戻</button><button title="その他">…</button></div></div>
</div>
<div class="section">19–24</div><div class="tasks"><div class="task" data-task><div class="mark">○</div><div><div class="title">📚 本を読む</div><div class="meta">20m</div></div><div class="actions"><button class="primary" title="開始">始</button><button title="翌日">翌</button><button title="その他">…</button></div></div></div>
</main>
<div class="note">デザイン検証用。行を選ぶと、選択中のタスクだけ操作を表示します。</div>
<div class="shade" id="shade"></div><section class="sheet" id="sheet" aria-label="表示する操作"><div class="sheet-head"><strong>表示する操作</strong><button id="close" aria-label="閉じる">×</button></div><div class="setting-grid">
<button class="setting on"><b>済</b>完了<small>状態を変更</small></button><button class="setting on"><b>始</b>開始<small>実行開始</small></button><button class="setting"><b>終</b>終了<small>実行終了</small></button><button class="setting on"><b>時</b>時刻<small>開始時刻</small></button><button class="setting"><b>保</b>保留<small>後で再開</small></button><button class="setting on"><b>翌</b>翌日<small>次の日へ</small></button><button class="setting"><b>上</b>上へ<small>並べ替え</small></button><button class="setting"><b>削</b>削除<small>タスク削除</small></button></div><div class="legend">今は文字で表示し、将来は同じ意味キーにアイコンを割り当てます。</div></section>
<script>const body=document.body;document.getElementById('menu').onclick=()=>body.classList.add('open');document.getElementById('shade').onclick=document.getElementById('close').onclick=()=>body.classList.remove('open');document.querySelectorAll('[data-task]').forEach(row=>row.addEventListener('click',e=>{if(e.target.closest('button'))return;document.querySelectorAll('[data-task]').forEach(x=>x.classList.remove('selected'));row.classList.add('selected')}));document.querySelectorAll('.setting').forEach(x=>x.onclick=()=>x.classList.toggle('on'));</script>
</body>
</html>
