<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TaskLiner Repeat</title><style>:root{--bg:#f5f5f2;--panel:#fff;--text:#20211f;--muted:#777a73;--line:#dedfd9;--accent:#2f5d50;--soft:#eef4f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:980px;margin:auto;padding:12px 14px 70px}.nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);padding:8px 0}.nav a{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700}.nav a.active{background:var(--accent);border-color:var(--accent);color:#fff}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 12px}.head h1{font-size:20px;margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.actions,.filters{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.8fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.list{display:flex;flex-direction:column;gap:6px}.item{border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:13px;font-weight:750}.meta,.status,.note{font-size:10px;color:var(--muted);margin-top:3px}.pill{font-size:9px;padding:2px 6px;border-radius:999px;background:var(--soft);color:var(--accent)}.field{margin-bottom:8px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fafbf9}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.suggest{position:relative}.suggest-list{position:absolute;z-index:30;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}.suggest-list:empty{display:none}.suggest-list button{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:8px}.hidden{display:none!important}h2{font-size:13px;margin:0 0 9px}@media(max-width:760px){.grid{grid-template-columns:1fr}.detail{order:-1}.field-grid{grid-template-columns:1fr}}</style></head>
<body><div class="app"><nav class="nav"><a href="./today.html">Today</a><a href="./master.html">Master</a><a class="active" href="./repeat.html">Repeat</a></nav><div class="head"><div><h1>Repeat</h1><div class="note">いつDailyへ出すかを管理</div></div><div class="actions"><button id="generate" class="btn primary">今日分を生成</button><button id="newBtn" class="btn">新規Repeat</button></div></div><div id="status" class="status">読み込み中…</div><div class="filters"><select id="stateFilter" class="btn"><option value="all">すべて</option><option value="active">activeのみ</option><option value="inactive">inactiveのみ</option></select><select id="weekdayFilter" class="btn"><option value="all">全曜日</option><option value="0">日</option><option value="1">月</option><option value="2">火</option><option value="3">水</option><option value="4">木</option><option value="5">金</option><option value="6">土</option></select><button id="reload" class="btn">再読込</button></div><div class="grid" style="margin-top:10px"><section class="card"><h2>Repeats</h2><div id="list" class="list"></div></section><section class="card detail"><h2>詳細</h2><div id="empty" class="note">Repeatを選択してください。</div><form id="form" hidden><input id="rid" type="hidden"><input id="masterId" type="hidden"><div class="field suggest"><label>Master</label><input id="masterQuery" autocomplete="off"><div id="suggestions" class="suggest-list"></div></div><div class="field-grid"><div class="field"><label>ルール</label><select id="rule"><option value="daily">毎日</option><option value="weekdays">曜日指定</option><option value="weekly">毎週</option><option value="biweekly">隔週</option><option value="nth_weekday">第●曜日</option><option value="month_end">月末日</option></select></div><div class="field"><label>状態</label><select id="repeatStatus"><option value="active">active</option><option value="inactive">inactive</option></select></div></div><div id="weekdaysWrap" class="field hidden"><label>曜日指定（日=0 … 土=6、カンマ区切り）</label><input id="weekdays" placeholder="1,2,3,4,5"></div><div id="weekdayWrap" class="field hidden"><label>曜日（日=0 … 土=6）</label><input id="weekday" type="number" min="0" max="6"></div><div id="nthWrap" class="field hidden"><label>第何週</label><input id="nth" type="number" min="1" max="5"></div><div id="anchorWrap" class="field hidden"><label>隔週の基準日</label><input id="anchor" type="date"></div><div class="field-grid"><div class="field"><label>Section</label><input id="section" placeholder="7-9"></div><div class="field"><label>planned_at</label><input id="planned" type="time"></div></div><div class="field"><label>見積上書き（空欄=Master標準）</label><input id="estimate" type="number" min="0" step="5"></div><div class="note">この変更は今後生成するDailyにだけ反映されます。既存Dailyは変更しません。</div><div class="actions" style="margin-top:9px"><button class="btn primary" type="submit">保存</button><a id="masterLink" class="btn" href="./master.html">Masterを見る</a></div></form></section></div></div><script src="./template-core.js"></script><script src="./daily-integration.js"></script><script src="./template-store.js"></script><script>(()=>{'use strict';const TL=TaskLinerTemplates,DI=TaskLinerDailyIntegration,S=TaskLinerTemplateStore,$=id=>document.getElementById(id);let masters=[],repeats=[],selected='';const jp=['日','月','火','水','木','金','土'];function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function status(t){$('status').textContent=t}function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function name(id){return masters.find(m=>m.id===id)?.title||id}function label(r){if(r.rule==='daily')return'毎日';if(r.rule==='weekdays')return(r.weekdays||[]).map(x=>jp[x]).join('・');if(r.rule==='weekly')return`毎週${jp[r.weekday]||r.weekday}`;if(r.rule==='biweekly')return`隔週${jp[r.weekday]||r.weekday}`;if(r.rule==='nth_weekday')return`第${r.nth}${jp[r.weekday]||r.weekday}`;if(r.rule==='month_end')return'月末日';return r.rule}function appliesWeekday(r,w){if(r.rule==='daily'||r.rule==='month_end')return true;if(r.rule==='weekdays')return(r.weekdays||[]).map(Number).includes(w);return Number(r.weekday)===w}function render(){const state=$('stateFilter').value,w=$('weekdayFilter').value;const rows=[...repeats].filter(r=>(state==='all'||(r.status||'active')===state)&&(w==='all'||appliesWeekday(r,Number(w)))).sort((a,b)=>String(a.planned_at||'99:99').localeCompare(String(b.planned_at||'99:99'))||String(name(a.master_id)).localeCompare(String(name(b.master_id)),'ja'));$('list').innerHTML=rows.map(r=>`<div class="item" data-id="${esc(r.id)}"><div class="row"><div class="title">${esc(name(r.master_id))}</div><span class="pill">${esc(r.planned_at||'--:--')}</span></div><div class="meta">${esc(label(r))} ・ ${esc(r.section||'sectionなし')} ・ ${r.estimate!==''&&r.estimate!==null&&r.estimate!==undefined?`${r.estimate}m上書き`:'Master見積'} ・ ${esc(r.status||'active')}</div></div>`).join('')||'<div class="note">該当Repeatはありません。</div>';document.querySelectorAll('#list .item').forEach(el=>el.onclick=()=>openRepeat(el.dataset.id))}function ruleFields(){const r=$('rule').value;$('weekdaysWrap').classList.toggle('hidden',r!=='weekdays');$('weekdayWrap').classList.toggle('hidden',!['weekly','biweekly','nth_weekday'].includes(r));$('nthWrap').classList.toggle('hidden',r!=='nth_weekday');$('anchorWrap').classList.toggle('hidden',r!=='biweekly')}function openRepeat(id){const r=repeats.find(x=>x.id===id);if(!r)return;selected=id;$('empty').hidden=true;$('form').hidden=false;$('rid').value=r.id;$('masterId').value=r.master_id;$('masterQuery').value=name(r.master_id);$('rule').value=r.rule||'daily';$('repeatStatus').value=r.status||'active';$('weekdays').value=(r.weekdays||[]).join(',');$('weekday').value=r.weekday??'';$('nth').value=r.nth??'';$('anchor').value=r.anchor_date||today();$('section').value=r.section||'';$('planned').value=r.planned_at||'';$('estimate').value=r.estimate??'';$('masterLink').href=`./master.html?id=${encodeURIComponent(r.master_id)}`;ruleFields();history.replaceState(null,'',`?id=${encodeURIComponent(r.id)}`)}function newRepeat(master=''){selected='';$('empty').hidden=true;$('form').hidden=false;$('rid').value='';$('masterId').value=master;$('masterQuery').value=name(master)==master?'':name(master);$('rule').value='daily';$('repeatStatus').value='active';$('weekdays').value='1,2,3,4,5';$('weekday').value='1';$('nth').value='1';$('anchor').value=today();$('section').value='';$('planned').value='';$('estimate').value='';ruleFields();$('masterQuery').focus()}function suggestions(){const q=$('masterQuery').value.trim(),root=$('suggestions');if(!q){root.innerHTML='';return}root.innerHTML=TL.suggestMasters(q,masters,3).map(m=>`<button type="button" data-id="${esc(m.id)}">${esc(m.title)} <small>${m.estimate||0}m</small></button>`).join('');root.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const m=masters.find(x=>x.id===btn.dataset.id);$('masterId').value=m.id;$('masterQuery').value=m.title;root.innerHTML='';$('masterLink').href=`./master.html?id=${encodeURIComponent(m.id)}`})}async function reload(){status('Master / Repeatを読み込み中…');try{[masters,repeats]=await Promise.all([S.loadMasters(),S.loadRepeats()]);render();const p=new URLSearchParams(location.search),id=p.get('id'),master=p.get('master');if(id&&repeats.some(r=>r.id===id))openRepeat(id);else if(master)newRepeat(master);status(`Repeat ${repeats.length}件`)}catch(e){status(`読込失敗: ${e.message}`)}}$('stateFilter').onchange=render;$('weekdayFilter').onchange=render;$('reload').onclick=reload;$('newBtn').onclick=()=>newRepeat();$('rule').onchange=ruleFields;$('masterQuery').oninput=suggestions;$('form').onsubmit=async e=>{e.preventDefault();const masterId=$('masterId').value;if(!masterId){status('Masterを選択してください');return}let r=repeats.find(x=>x.id===$('rid').value)||{id:TL.id('repeat'),master_id:masterId};r.master_id=masterId;r.status=$('repeatStatus').value;r.rule=$('rule').value;r.weekdays=$('weekdays').value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isInteger(x)&&x>=0&&x<=6);r.weekday=$('weekday').value===''?'':Number($('weekday').value);r.nth=$('nth').value===''?'':Number($('nth').value);r.anchor_date=$('anchor').value;r.section=$('section').value.trim();r.planned_at=$('planned').value;r.estimate=$('estimate').value===''?'':Math.max(0,Math.round(Number($('estimate').value)||0));status('保存中…');try{await S.saveRepeat(r);await reload();openRepeat(r.id);status('保存しました')}catch(err){status(`保存失敗: ${err.message}`)}};$('generate').onclick=async()=>{status('今日分を生成中…');try{const date=today(),path=`${S.cfg().folder}/${date}.md`,file=await S.readFile(path),markdown=file?.text||'';const existing=DI.existingInstances(markdown,masters),instances=TL.generateDailyInstances(date,masters,repeats,existing);if(!instances.length){status('未生成のRepeatはありません');return}const merged=DI.mergeGeneratedIntoMarkdown(markdown,instances);await S.putFile(path,merged,`TaskLiner repeat generate: ${date}`);instances.forEach(x=>S.markRecent(x.master_id));status(`${instances.length}件を${date}へ生成しました。Todayでpullしてください。`)}catch(e){status(`生成失敗: ${e.message}`)}};reload()})();</script></body></html>
