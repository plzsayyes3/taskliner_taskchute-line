<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskLiner</title>
<script>
(async()=>{
  if(window.top===window.self){
    window.location.replace(`./index.html${window.location.search}${window.location.hash}`);
    return;
  }
  try{
    const url=new URL('./app.html',window.location.href);
    url.searchParams.set('_v',String(Date.now()));
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    html=html.replace(
      "return s==='running'?'[/]':s==='done'?'[x]':s==='deferred'?'[>]':'[ ]'",
      "return s==='running'?'●':s==='done'?'✓':s==='deferred'?'–':'○'"
    );
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML=`<p>TaskLinerの読み込みに失敗しました: ${String(error.message||error)}</p>`;
  }
})();
</script>
</head>
<body>
<p>TaskLinerを読み込んでいます…</p>
</body>
</html>
