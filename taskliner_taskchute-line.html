<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskLiner</title>
<script>
(async()=>{
  if(window.top===window.self){
    window.location.replace(`./index.html${window.location.search}${window.location.hash}`);
    return;
  }
  try{
    const THEME_KEY='taskliner_theme_v1';
    const theme=localStorage.getItem(THEME_KEY)||'soft';
    const url=new URL('./app.html',window.location.href);
    url.searchParams.set('_v',String(Date.now()));
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();

    // Runtime feature patches kept outside app.html so the Markdown/data core stays stable.
    html=html.replace(
      "function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);removeTaskNode(id);save()}",
      "function changeEstimate(id){const t=tasks.find(x=>x.id===id);if(!t)return;const raw=prompt('見積もり（分）',String(t.estimate||0));if(raw===null)return;const value=Number(String(raw).trim());if(!Number.isFinite(value)||value<0){toast('見積もりは0以上の数値で入力してください');return}t.estimate=Math.round(value);save()}function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);removeTaskNode(id);save()}"
    );
    html=html.replace(
      "menu.append(btn('終了見込み変更',()=>changeExpectedEnd(t.id)),btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))",
      "menu.append(btn('見積もり変更',()=>changeEstimate(t.id)),btn('終了見込み変更',()=>changeExpectedEnd(t.id)),btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))"
    );
    html=html.replace(
      "function addNew(){const title=$('newTitle').value.trim();if(!title)return;const section=tasks.length?tasks[tasks.length-1].section:'';const task=normalizeTask({title,estimate:Number($('newEstimate').value)||0,section});tasks.push(task);insertTaskNode(task);$('newTitle').value='';$('newEstimate').value='';save();$('newTitle').focus()}",
      "function addNew(){const title=$('newTitle').value.trim();if(!title)return;const task=normalizeTask({title,estimate:Number($('newEstimate').value)||0,section:''});tasks.unshift(task);let insertAt=documentNodes.findIndex(n=>n.type==='task'||(n.type==='raw'&&/^\\s*##\\s+/.test(n.text)));if(insertAt<0)insertAt=documentNodes.length;documentNodes.splice(insertAt,0,{type:'task',id:task.id});$('newTitle').value='';$('newEstimate').value='';save();$('newTitle').focus()}"
    );
    html=html.replace(
      "function endTaskAt(id){const t=tasks.find(x=>x.id===id);if(!t||stateOf(t)!=='running')return;const at=askClock('終了時刻',nowTime());if(at===null)return;endTask(id,at)}",
      "function markDone(id){const t=tasks.find(x=>x.id===id);if(!t||stateOf(t)==='running'||stateOf(t)==='done')return;t.start='';t.end='';t.actualMin=0;t.completed=true;t.deferred=false;t.skipDate='';save();toast('時刻なしで完了にしました')}function interruptTask(id,explicitAt=''){const i=tasks.findIndex(x=>x.id===id);if(i<0)return;const t=tasks[i];if(stateOf(t)!=='running')return;const at=explicitAt||nowTime();t.end=at;t.actualMin=elapsed(t.start,t.end);t.completed=true;const remaining=t.estimate>0?Math.max(t.estimate-t.actualMin,0):0;const continuation=normalizeTask({...t,id:uid(),estimate:remaining,start:'',end:'',actualMin:0,completed:false,deferred:false,skipDate:'',childLines:[...(t.childLines||[])]});tasks.splice(i+1,0,continuation);const nodeIndex=documentNodes.findIndex(n=>n.type==='task'&&n.id===id);if(nodeIndex>=0)documentNodes.splice(nodeIndex+1,0,{type:'task',id:continuation.id});else insertTaskNode(continuation);save();toast(t.estimate>0?`中断しました。残り見積 ${remaining}m`:'中断しました。見積もりなしで継続タスクを作成しました')}function endTaskAt(id){const t=tasks.find(x=>x.id===id);if(!t||stateOf(t)!=='running')return;const dialog=$('tasklinerEndDialog');if(!dialog||typeof dialog.showModal!=='function'){const at=askClock('終了時刻',nowTime());if(at===null)return;if(confirm('中断として処理しますか？'))interruptTask(id,at);else endTask(id,at);return}const input=$('tasklinerEndTime'),check=$('tasklinerEndInterrupt'),confirmBtn=$('tasklinerEndConfirm');input.value=nowTime();check.checked=false;confirmBtn.onclick=e=>{e.preventDefault();const at=normalizeClockInput(input.value);if(!at){toast('時刻は HH:MM で入力してください');return}const interrupted=check.checked;dialog.close();if(interrupted)interruptTask(id,at);else endTask(id,at)};dialog.showModal()}"
    );
    html=html.replace(
      "if(s==='todo'||s==='deferred'){actions.append(btn('開始',()=>startTask(t.id),false,'primary-action'),btn('時刻指定',()=>startTaskAt(t.id)),btn('前回から',()=>startTask(t.id,true)))}",
      "if(s==='todo'||s==='deferred'){actions.append(btn('開始',()=>startTask(t.id),false,'primary-action'),btn('時刻指定',()=>startTaskAt(t.id)),btn('前回から',()=>startTask(t.id,true)),btn('完了のみ',()=>markDone(t.id)))}"
    );
    html=html.replace(
      "if(s==='running')actions.append(btn('終了',()=>endTask(t.id),false,'primary-action'),btn('終了時刻',()=>endTaskAt(t.id)));",
      "if(s==='running')actions.append(btn('終了',()=>endTask(t.id),false,'primary-action'),btn('中断',()=>interruptTask(t.id),false,'interrupt-action'),btn('終了時刻',()=>endTaskAt(t.id)));"
    );
    html=html.replace(
      "if(s==='running')return '<i class=\"ph-fill ph-play\" aria-hidden=\"true\"></i>';",
      "if(s==='running')return '<i class=\"ph-fill ph-stop\" aria-hidden=\"true\"></i>';"
    );
    html=html.replace('<div class="label">実行中</div>','<div class="label">RUNNING NOW</div>');
    html=html.replace('<div class="add-label">タスク追加</div>','<div class="add-label">QUICK ADD</div>');
    html=html.replace(
      '<button id="currentEndBtn" class="current-end" type="button" hidden>終了</button>',
      '<div class="current-controls"><button id="currentEndBtn" class="current-end primary-current" type="button" hidden>■ 終了</button><button id="currentInterruptBtn" class="current-end" type="button" hidden>Ⅱ 中断</button><button id="currentEndTimeBtn" class="current-end" type="button" hidden>終了時刻</button></div>'
    );
    html=html.replace(
      "$('currentEndBtn').hidden=!running;$('currentEndBtn').onclick=running?()=>endTask(running.id):null;",
      "$('currentEndBtn').hidden=!running;$('currentEndBtn').onclick=running?()=>endTask(running.id):null;$('currentInterruptBtn').hidden=!running;$('currentInterruptBtn').onclick=running?()=>interruptTask(running.id):null;$('currentEndTimeBtn').hidden=!running;$('currentEndTimeBtn').onclick=running?()=>endTaskAt(running.id):null;"
    );

    const v2Style=`<style id="taskliner-v2-style">
      :root{color-scheme:light;--bg:#f4f7f8!important;--panel:#fff!important;--text:#1f272b!important;--muted:#748087!important;--line:#d8e0e3!important;--accent:#416873!important;--danger:#92525a!important;--running:#fff!important;--done:#f5f7f7!important;--deferred:#f2f6f7!important;--shadow:0 10px 28px rgba(24,40,46,.045)!important}
      body{background:var(--bg)!important;color:var(--text)!important}
      .app{max-width:1180px!important;padding:12px 18px 84px!important}
      .top{padding:8px 0 12px!important;background:color-mix(in srgb,var(--bg) 94%,transparent)!important;backdrop-filter:blur(14px)!important}
      .topline{gap:18px!important;min-height:42px!important}.brand{font-size:16px!important;font-weight:800!important}.clock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;font-size:27px!important;font-weight:600!important;letter-spacing:.045em!important}
      .header-row{margin-top:11px!important;align-items:flex-end!important}.datebar{gap:7px!important}.datebar button{height:38px!important;border-radius:12px!important}.datebar .arrow{width:42px!important}.date-btn{min-width:190px!important;font-size:17px!important;font-weight:800!important}.today-btn{padding-inline:12px!important}.today-mark{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;letter-spacing:.06em!important}
      .summary-line{gap:18px!important;font-size:11px!important;padding-bottom:4px!important}.summary-line b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;font-size:12px!important}
      .workspace{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr)!important;gap:12px!important;margin:8px 0 14px!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}
      .current,.add{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:var(--shadow)!important}.current{padding:16px 18px!important}.add{padding:16px!important}.current-head{align-items:center!important}.current .label,.add-label{font-size:10px!important;font-weight:800!important;letter-spacing:.09em!important;color:var(--muted)!important}.current-elapsed{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;font-size:12px!important}.current-main{grid-template-columns:1fr!important;margin-top:7px!important}.current .title{font-size:21px!important;font-weight:800!important}.current .time{font-size:12px!important;margin-top:4px!important}.current-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.current-end{padding:7px 12px!important;border-radius:10px!important;font-size:12px!important}.current-end.primary-current{background:var(--text)!important;color:#fff!important;border-color:var(--text)!important}.current-end[hidden]{display:none!important}
      .add-label{margin:0 0 8px 2px!important}.add-form{grid-template-columns:1fr 82px auto!important;gap:7px!important}.add input{background:#fafcfd!important;border-color:var(--line)!important;border-radius:11px!important;padding:9px 10px!important;font-size:12px!important}.add .primary{background:var(--text)!important;border:1px solid var(--text)!important;border-radius:11px!important;padding:8px 14px!important}
      .toolbar{gap:7px!important;margin:2px 0 12px!important}.toolbar button{border-radius:999px!important;padding:7px 11px!important;background:var(--panel)!important}.toolbar button.active{background:#e3eef1!important;color:var(--accent)!important;border-color:#cddde2!important}
      .tasks{gap:8px!important}.section-block{gap:8px!important;margin-top:12px!important}.section-head{padding:8px 3px 3px!important}.section-title{font-size:11px!important;font-weight:800!important;letter-spacing:.045em!important;text-transform:uppercase!important}
      .task{min-height:78px!important;grid-template-columns:42px 1fr!important;gap:10px!important;padding:11px 12px!important;border-radius:13px!important;box-shadow:0 4px 16px rgba(24,40,46,.025)!important}.status-btn{width:34px!important;height:34px!important;min-width:34px!important;border-radius:50%!important;background:rgba(255,255,255,.88)!important}.task.running .status-btn{background:var(--text)!important;color:#fff!important;border-color:var(--text)!important}.task.done .status-btn{color:var(--accent)!important}.task-title{font-size:14px!important;font-weight:700!important}.task-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;font-size:10px!important;gap:10px!important;margin-top:5px!important}.task-actions{gap:6px!important;margin-top:8px!important}.task-actions button,.task-more summary{border-radius:9px!important;padding:5px 8px!important;background:rgba(255,255,255,.88)!important}.task-actions .primary-action{background:var(--text)!important;color:#fff!important;border-color:var(--text)!important}.task-actions .interrupt-action{font-weight:700!important;color:var(--accent)!important}.task-actions .move-action{min-width:32px!important}.task.done{opacity:.62!important}.task.done .task-title{text-decoration:line-through;text-decoration-thickness:1px}.task.deferred{background:#f7fafb!important}
      .section-menu{border-radius:14px!important}.raw{margin-top:22px!important}.raw textarea{background:var(--panel)!important;border-radius:12px!important}
      button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 28%,transparent)!important;outline-offset:2px!important}
      button:not(:disabled):hover,.task-more summary:hover{border-color:color-mix(in srgb,var(--accent) 42%,var(--line))!important}
      @media(max-width:720px){.app{padding:9px 10px 72px!important}.topline{gap:10px!important}.clock{font-size:22px!important}.header-row{align-items:flex-start!important}.workspace{grid-template-columns:1fr!important}.current,.add{border-radius:14px!important}.add-form{grid-template-columns:1fr 76px!important}.add .primary{grid-column:1/-1!important}.summary-line{gap:11px!important}.date-btn{min-width:0!important;font-size:15px!important}.task{grid-template-columns:38px 1fr!important}.add input,.task-title,.raw textarea,.taskliner-time-field input[type=time]{font-size:16px!important}}
    </style>`;
    html=html.replace('</head>',v2Style+'</head>');

    const dialogStyle=`<style id="taskliner-end-dialog-style">
      .taskliner-time-dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.2);width:min(340px,calc(100vw - 28px))}
      .taskliner-time-dialog::backdrop{background:rgba(20,20,20,.28);backdrop-filter:blur(2px)}
      .taskliner-time-form{padding:16px;display:flex;flex-direction:column;gap:13px}
      .taskliner-time-title{font-size:14px;font-weight:800}
      .taskliner-time-field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
      .taskliner-time-field input[type=time]{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 9px;font:inherit;color:var(--text)}
      .taskliner-time-check{display:flex;align-items:center;gap:8px;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
      .taskliner-time-check input{width:17px;height:17px}
      .taskliner-time-actions{display:flex;justify-content:flex-end;gap:7px}
      .taskliner-time-actions button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;font-size:12px}
      .taskliner-time-actions .primary{background:var(--text)!important;color:#fff!important;border-color:var(--text)!important}
    </style>`;
    html=html.replace('</head>',dialogStyle+'</head>');
    html=html.replace(
      '<div id="toast" class="toast"></div>',
      '<div id="toast" class="toast"></div><dialog id="tasklinerEndDialog" class="taskliner-time-dialog"><form method="dialog" class="taskliner-time-form"><div class="taskliner-time-title">終了時刻</div><label class="taskliner-time-field"><span>時刻</span><input id="tasklinerEndTime" type="time" required></label><label class="taskliner-time-check"><input id="tasklinerEndInterrupt" type="checkbox"><span>中断として処理</span></label><div class="taskliner-time-actions"><button value="cancel">キャンセル</button><button id="tasklinerEndConfirm" class="primary" value="default">確定</button></div></form></dialog>'
    );

    if(theme==='terminal'){
      const terminalStyle=`<style id="taskliner-terminal-theme">
        :root{--bg:#fff!important;--panel:#fff!important;--text:#111!important;--muted:#555!important;--line:#111!important;--accent:#111!important;--danger:#111!important;--running:#f3f3f3!important;--done:#fafafa!important;--deferred:#fafafa!important;--shadow:none!important}
        html{color-scheme:light!important}body{background:#fff!important;color:#111!important;letter-spacing:.005em}.top{background:#fff!important;backdrop-filter:none!important;border-bottom:1px solid #111!important}.brand{letter-spacing:.04em!important}
        button,input,textarea,.current,.add,.task,.section-menu,.raw textarea,.task-more summary,.taskliner-time-dialog{border-radius:0!important;box-shadow:none!important}.datebar button,.toolbar button,.task-actions button,.status-btn,.section-head button,.section-menu button,.current-end{border-color:#111!important;background:#fff!important;color:#111!important}.workspace{background:transparent!important}.current,.add{border:1px solid #111!important;background:#fff!important}.add input{background:#fff!important;border-color:#111!important}.primary,.current-end.primary-current{background:#111!important;color:#fff!important;border:1px solid #111!important}.toolbar button.active{background:#111!important;color:#fff!important}.task{border:1px solid #111!important;background:#fff!important}.task.deferred{background:#fff!important;border-style:dashed!important}.task.running .status-btn{background:#111!important;color:#fff!important}.task-actions .primary-action{border:1px solid #111!important;background:#111!important;color:#fff!important}.task-more summary{border-color:#111!important;background:#fff!important;color:#111!important}.section-menu,.raw,.raw textarea{border-color:#111!important}.empty{border-color:#111!important;border-radius:0!important}.taskliner-time-dialog,.taskliner-time-field input[type=time],.taskliner-time-check,.taskliner-time-actions button{border-color:#111!important;background:#fff!important;color:#111!important}
      </style>`;
      html=html.replace('</head>',terminalStyle+'</head>');
    }

    const heatStyle=`<style id="taskliner-time-heat-style">
      .task.running{transition:background .7s linear,border-color .25s ease,color .25s ease!important}.task.running.time-no-estimate{box-shadow:none!important}.task.running.time-progress-dark,.task.running.time-progress-dark .task-title,.task.running.time-progress-dark .task-meta,.task.running.time-progress-dark .status-btn{color:#fff!important}.task.running.time-progress-dark .task-actions button,.task.running.time-progress-dark .task-more summary{color:#fff!important;border-color:rgba(255,255,255,.55)!important;background:rgba(0,0,0,.08)!important}.task.running.time-progress-dark .task-actions .primary-action{color:#1f272b!important;background:rgba(255,255,255,.92)!important;border-color:rgba(255,255,255,.92)!important}.task.running.time-progress-dark .task-actions .delete-action{color:#fff!important}
    </style>`;
    html=html.replace('</head>',heatStyle+'</head>');

    const heatScript=`<script id="taskliner-time-heat-script">
      (()=>{const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));const rgba=(v,a=.72)=>\`rgba(\${v[0]}, \${v[1]}, \${v[2]}, \${a})\`;const overStops=[[1,[196,217,222]],[1.5,[154,179,186]],[2,[91,108,114]]];function overColor(ratio){const r=clamp(ratio,1,2);for(let i=0;i<overStops.length-1;i++){const[aPos,aColor]=overStops[i],[bPos,bColor]=overStops[i+1];if(r<=bPos)return mix(aColor,bColor,(r-aPos)/(bPos-aPos))}return overStops[overStops.length-1][1]}function elapsedSeconds(h,m){const d=new Date();let n=d.getHours()*3600+d.getMinutes()*60+d.getSeconds()-(h*3600+m*60);if(n<0)n+=86400;return n}function clearProgress(row){row.style.removeProperty('background');row.style.removeProperty('border');row.classList.remove('time-no-estimate','time-progress-dark');delete row.dataset.timeRatio;delete row.dataset.progress}function updateProgress(){document.querySelectorAll('.task').forEach(row=>{if(!row.classList.contains('running')){clearProgress(row);return}const meta=row.querySelector('.task-meta')?.textContent||'';const estimateMatch=meta.match(/見積\\s*(\\d+)m/);const startMatch=meta.match(/開始\\s*(\\d{1,2}):(\\d{2})/);const estimate=estimateMatch?Number(estimateMatch[1]):0;if(!estimate){row.style.removeProperty('background');row.style.setProperty('border','2px solid rgba(65,104,115,.5)','important');row.classList.add('time-no-estimate');row.classList.remove('time-progress-dark');delete row.dataset.timeRatio;delete row.dataset.progress;return}if(!startMatch){clearProgress(row);return}const seconds=elapsedSeconds(Number(startMatch[1]),Number(startMatch[2]));const ratio=seconds/(estimate*60);const width=clamp(ratio,0,1)*100;let fill;if(ratio<=1){const color=mix([230,240,243],[190,216,222],clamp(ratio,0,1));fill=rgba(color,.76)}else fill=rgba(overColor(ratio),ratio>=1.75?.78:.72);row.dataset.timeRatio=ratio.toFixed(3);row.dataset.progress=Math.round(ratio*100)+'%';row.style.setProperty('border','1px solid var(--line)','important');row.style.setProperty('background',\`linear-gradient(to right, \${fill} 0%, \${fill} \${width}%, transparent \${width}%, transparent 100%), var(--panel)\`,'important');row.classList.remove('time-no-estimate');row.classList.toggle('time-progress-dark',ratio>=1.9)})}setInterval(updateProgress,1000);requestAnimationFrame(updateProgress);const root=document.getElementById('tasks');if(root)new MutationObserver(updateProgress).observe(root,{childList:true,subtree:true})})();
    <\/script>`;
    html=html.replace('</body>',heatScript+'</body>');

    const bridgeScript=`<script id="taskliner-theme-bridge">
      (()=>{const THEME_KEY='taskliner_theme_v1',CONFIG_KEY='taskliner_github_sync_config_v1',API_COOLDOWN_KEY='taskliner_github_api_cooldown_until_v1',theme=localStorage.getItem(THEME_KEY)||'soft';function install(){try{const pw=window.parent,pd=pw.document,panel=pd.getElementById('syncPanel');if(!panel){setTimeout(install,50);return}try{const c=JSON.parse(pw.localStorage.getItem(CONFIG_KEY)||'{}');if(!c.branch||c.branch==='task-data'){c.branch='main';pw.localStorage.setItem(CONFIG_KEY,JSON.stringify(c))}const branchInput=pd.getElementById('ghBranch');if(branchInput&&(!branchInput.value||branchInput.value==='task-data'))branchInput.value='main'}catch(error){}if(!pw.__tasklinerGithubApiGuard){const rawFetch=pw.fetch.bind(pw),cache=new Map();let lastGithubRequestAt=0;const CACHE_MS=15*60*1000,MIN_REQUEST_GAP=500,sleep=ms=>new Promise(r=>pw.setTimeout(r,ms)),syntheticLimit=until=>new pw.Response(JSON.stringify({message:\`GitHub APIを一時休止中です。\${new Date(until).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}頃に再試行してください。\`}),{status:429,headers:{'Content-Type':'application/json'}}),isGithubUrl=value=>{try{return new URL(typeof value==='string'?value:value.url).hostname==='api.github.com'}catch{return false}},methodOf=(input,init)=>String(init?.method||input?.method||'GET').toUpperCase(),cacheable=url=>{try{const u=new URL(url);return /^\\/repos\\/[^/]+\\/[^/]+$/.test(u.pathname)||/^\\/repos\\/[^/]+\\/[^/]+\\/branches\\/[^/]+$/.test(u.pathname)}catch{return false}};pw.fetch=async function(input,init){if(!isGithubUrl(input))return rawFetch(input,init);const now=Date.now(),cooldownUntil=Number(pw.localStorage.getItem(API_COOLDOWN_KEY)||0);if(cooldownUntil>now)return syntheticLimit(cooldownUntil);const url=typeof input==='string'?input:input.url,method=methodOf(input,init),key=method+' '+url;if(method==='GET'&&cacheable(url)){const hit=cache.get(key);if(hit&&now-hit.at<CACHE_MS)return new pw.Response(hit.body,{status:hit.status,headers:hit.headers})}const gap=D
