<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TaskLiner Today</title><style>:root{--bg:#f5f5f2;--panel:#fff;--text:#20211f;--muted:#777a73;--line:#dedfd9;--accent:#2f5d50}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:#fff}.nav,.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.nav a,.actions button{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700}.nav a.active,.actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.status{font-size:10px;color:var(--muted);max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame{width:100%;height:100%;border:0;display:block}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.status{max-width:100%}}</style></head><body><div class="shell"><header class="top"><nav class="nav"><a class="active" href="./today.html">Today</a><a href="./master.html">Master</a><a href="./repeat.html">Repeat</a></nav><div class="actions"><span id="status" class="status">Master読込中…</span><button id="pull" type="button">Master Pull</button><button id="generate" class="primary" type="button">Repeatから今日分を生成</button></div></header><iframe id="todayFrame" class="frame" src="./index-v2.html" title="TaskLiner Today"></iframe></div><script src="./template-core.js"></script><script src="./daily-integration.js"></script><script src="./template-store.js"></script><script>(()=>{'use strict';const TL=TaskLinerTemplates,DI=TaskLinerDailyIntegration,S=TaskLinerTemplateStore,$=id=>document.getElementById(id);let masters=[],repeats=[],appDoc=null,appWin=null,selectedMaster='';function status(t){$('status').textContent=t}function innerApp(){try{const shell=$('todayFrame').contentDocument,frame=shell?.getElementById('app');const doc=frame?.contentDocument;if(doc?.getElementById('newTitle'))return{doc,win:frame.contentWindow}}catch{}return null}function cacheLabel(){const meta=S.getMasterCacheMeta(),t=meta.pulled_at?new Date(meta.pulled_at):null;return t&&!Number.isNaN(t.getTime())?` / Pull ${t.toLocaleString('ja-JP')}`:''}async function loadTemplates(force=false){try{if(force)status('GitHubからMasterをPull中…');[masters,repeats]=await Promise.all([force?S.pullMasters():S.loadMasters(),S.loadRepeats()]);status(`Master ${masters.length} / Repeat ${repeats.length}${cacheLabel()}`);return true}catch(e){status(`Template読込失敗: ${e.message}`);return false}}function exactOrNew(title,estimate){let master=selectedMaster&&masters.find(m=>m.id===selectedMaster);if(master&&TL.norm(master.title)!==TL.norm(title)&&!(master.aliases||[]).some(a=>TL.norm(a)===TL.norm(title)))master=null;if(!master)master=TL.findExactMaster(title,masters);if(master){S.markRecent(master.id);return master}master={id:TL.id('task'),title:String(title||'').trim(),aliases:[],status:'active',estimate:Math.max(0,Math.round(Number(estimate)||0))};masters.push(master);S.markRecent(master.id);S.saveMaster(master).then(()=>S.createReviewFor(master,masters)).then(()=>status(`Masterを追加: ${master.title}`)).catch(e=>status(`Master保存失敗: ${e.message}`));return master}function prepareMaster(){if(!appDoc||!appWin)return;const title=appDoc.getElementById('newTitle')?.value.trim();if(!title)return;const estimate=appDoc.getElementById('newEstimate')?.value||0;const master=exactOrNew(title,estimate);appWin.__tasklinerPendingMasterId=master.id;selectedMaster=''}function inject(){const found=innerApp();if(!found){setTimeout(inject,100);return}appDoc=found.doc;appWin=found.win;if(appDoc.getElementById('tasklinerMasterSuggestions'))return;const style=appDoc.createElement('style');style.id='taskliner-master-suggest-style';style.textContent='.add{position:relative}.master-suggestions{position:absolute;left:16px;right:16px;top:calc(100% - 4px);z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden}.master-suggestions:empty{display:none}.master-suggestions button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--panel);padding:8px 10px;text-align:left;font-size:11px}.master-suggestions button:last-child{border-bottom:0}.master-suggestions small{color:var(--muted)}';appDoc.head.append(style);const root=appDoc.createElement('div');root.id='tasklinerMasterSuggestions';root.className='master-suggestions';const add=appDoc.querySelector('.add');add?.append(root);const title=appDoc.getElementById('newTitle'),estimate=appDoc.getElementById('newEstimate'),button=appDoc.getElementById('addTask');function renderSuggest(){selectedMaster='';const q=title.value.trim();if(!q){root.innerHTML='';return}const found=TL.suggestMasters(q,masters,3);root.innerHTML='';for(const m of found){const b=appDoc.createElement('button');b.type='button';const t=appDoc.createElement('span');t.textContent=TL.displayTitle(m.title);const sm=appDoc.createElement('small');sm.textContent=`${m.estimate||0}m`;b.append(t,sm);b.onclick=()=>{title.value=m.title;estimate.value=m.estimate||0;selectedMaster=m.id;root.innerHTML='';title.focus()};root.append(b)}}title.addEventListener('input',renderSuggest);title.addEventListener('keydown',e=>{if(e.key==='Enter')prepareMaster()},true);estimate?.addEventListener('keydown',e=>{if(e.key==='Enter')prepareMaster()},true);button?.addEventListener('click',prepareMaster,true);status(`Today接続済み / Master ${masters.length}${cacheLabel()}`)}async function generateToday(){if(!appDoc||!appWin){status('Today画面へ接続中です');return}const box=appDoc.getElementById('markdownBox'),importBtn=appDoc.getElementById('importMdBtn'),date=(appDoc.getElementById('dateBtn')?.textContent||'').trim().slice(0,10);if(!box||!importBtn||!/^\d{4}-\d{2}-\d{2}$/.test(date)){status('Todayデータを取得できません');return}const existing=DI.existingInstances(box.value,masters),instances=TL.generateDailyInstances(date,masters,repeats,existing);if(!instances.length){status('未生成のRepeatはありません');return}const merged=DI.mergeGeneratedIntoMarkdown(box.value,instances);box.value=merged;const original=appWin.confirm;appWin.confirm=()=>true;try{importBtn.click()}finally{appWin.confirm=original}instances.forEach(x=>S.markRecent(x.master_id));status(`${instances.length}件をTodayへ追加しました`)}$('pull').onclick=async()=>{await loadTemplates(true);if(appDoc)status(`Master Pull完了 / ${masters.length}件${cacheLabel()}`)};$('generate').onclick=generateToday;$('todayFrame').addEventListener('load',()=>setTimeout(inject,100));loadTemplates(false).then(inject)})();</script></body></html>
