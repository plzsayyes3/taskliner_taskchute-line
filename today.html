function cacheLabel(){const meta=S.getMasterCacheMeta(),t=meta.pulled_at?new Date(meta.pulled_at):null;return t&&!Number.isNaN(t.getTime())?` / Pull ${t.toLocaleString('ja-JP')}`:''}async function loadTemplates(force=false){try{if(force)status('GitHubからMasterをPull中…');[masters,repeats]=await Promise.all([force?S.pullMasters():S.loadMasters(),S.loadRepeats()]);status(`Master ${masters.length} / Repeat ${repeats.length}${cacheLabel()}`);return true}catch(e){status(`Template読込失敗: ${e.message}`);return false}}function exactOrNew(title,estimate){let master=selectedMaster&&masters.find(m=>m.id===selectedMaster);if(master&&TL.norm(master.title)!==TL.norm(title)&&!(master.aliases||[]).some(a=>TL.norm(a)===TL.norm(title)))master=null;if(!master)master=TL.findExactMaster(title,masters);if(master){S.markRecent(master.id);return master}master={id:TL.id('task'),title:String(title||'').trim(),aliases:[],status:'active',estimate:Math.max(0,Math.round(Number(estimate)||0))};masters.push(master);S.markRecent(master.id);S.saveMaster(master).then(()=>S.createReviewFor(master,masters)).then(()=>status(`Masterを追加: ${master.title}`)).catch(e=>status(`Master保存失敗: ${e.message}`));return master}function prepareMaster(){if(!appDoc||!appWin)return;const title=appDoc.getElementById('newTitle')?.value.trim();if(!title)return;const estimate=appDoc.getElementById('newEstimate')?.value||0;const master=exactOrNew(title,estimate);appWin.__tasklinerPendingMasterId=master.id;selectedMaster=''}function inject(){const found=innerApp();if(!found){setTimeout(inject,100);return}appDoc=found.doc;appWin=found.win;applyDisplayScales();if(appDoc.getElementById('tasklinerMasterSuggestions'))return;const style=appDoc.createElement('style');style.id='taskliner-master-suggest-style';style.textContent='.add{position:relative}.master-suggestions{position:absolute;left:16px;right:16px;top:calc(100% - 4px);z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0, sters(),S.loadRepeats()]),existing=DI.existingInstances(box.value,freshMasters),instances=TL.generateDailyInstances(date,freshMasters,freshRepeats,existing);masters=freshMasters;repeats=freshRepeats;if(!instances.length){status('未生成のRepeatはありません');return}const merged=DI.mergeGeneratedIntoMarkdown(box.value,instances);box.value=merged;const original=appWin.confirm;appWin.confirm=()=>true;try{importBtn.click()}finally{appWin.confirm=original}instances.forEach(x=>S.markRecent(x.master_id));status(`${instances.length}件をTodayへ追加しました`)}catch(e){status(`生成失敗: ${e.message}`)}}$('settings').onclick=openSettings;$('pull').onclick=async()=>{closeMenu();await loadTemplates(true);if(appDoc)status(`Master Pull完了 / ${masters.length}件${cacheLabel()}`)};$('generate').onclick=()=>{closeMenu();generateToday()};$('todayFrame').addEventListener('load',()=>setTimeout(()=>{hideEmbeddedSettingsButton();inject()},100));setTimeout(hideEmbeddedSettingsButton,150);loadTemplates(false).then(inject)})();</script></body></html>
