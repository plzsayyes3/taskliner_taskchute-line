<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskLiner UI Sample</title>
<style>
:root{--bg:#f4f7f8;--panel:#fff;--text:#1f272b;--muted:#748087;--line:#d8e0e3;--accent:#416873}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-top:54px}
header{position:fixed;z-index:10;inset:0 0 auto;height:54px;background:rgba(244,247,248,.96);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(12px,calc((100vw - 900px)/2));backdrop-filter:blur(12px)}
.clock{font-weight:800;font-size:18px}.date{font-weight:750;font-size:13px}.progress{justify-self:end;font-size:11px;color:var(--muted);padding-right:44px}.menu{position:absolute;right:max(10px,calc((100vw - 900px)/2));top:9px;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}
main{max-width:900px;margin:auto;padding:12px}.running{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px}.running small{color:var(--muted)}.running strong{display:block;margin-top:2px}
.section{margin:13px 2px 5px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.05em}.tasks{display:flex;flex-direction:column;gap:4px}.task{display:grid;grid-template-columns:minmax(0,1fr) 30px;grid-template-areas:'info state';gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px}.task>div:first-child{grid-area:info;min-width:0}.state{grid-area:state;align-self:start;justify-self:end;width:27px;height:27px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);background:#fff}.title{font-size:13px;font-weight:700;line-height:1.45}.meta{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}.repeat{font-family:inherit}.selected{border-color:#9ab3ba;background:#f8fbfc}.actions{display:flex;justify-content:flex-end;gap:5px;margin-top:7px}.actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:11px}.actions .primary{background:var(--text);color:#fff;border-color:var(--text)}.done{opacity:.55}.done .title{text-decoration:line-through}.sheet,.shade{display:none}.open .shade{display:block;position:fixed;z-index:20;inset:0;background:#18202433}.open .sheet{display:block;position:fixed;z-index:21;top:0;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);padding:14px max(14px,calc((100vw - 700px)/2)) 18px;box-shadow:0 14px 38px #18202422}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.add{display:grid;grid-template-columns:1fr 75px auto;gap:7px;margin-bottom:10px}.add input,.add button,.grid button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.note{max-width:900px;margin:18px auto;color:var(--muted);font-size:11px;padding:0 12px}
@media(max-width:600px){header{grid-template-columns:auto 1fr;padding:0 54px 0 10px}.clock{font-size:16px}.progress{display:none}.date{justify-self:end}.menu{right:9px}.add{grid-template-columns:1fr 65px}.add button{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}.task{padding:7px;grid-template-columns:minmax(0,1fr) 30px;grid-template-areas:'info state'}.state{grid-area:state;align-self:start;justify-self:end}.task>div:first-child{grid-area:info;min-width:0}.actions{justify-content:flex-end}.running{margin-bottom:8px}}
</style></head>
<body>
<header><div class="clock">16:20</div><div class="date">9月19日（土）</div><div class="progress">3/9 完了</div><button class="menu" id="menu">☰</button></header>
<main>
<section class="running"><small>実行中　経過 08m</small><strong>📖 資料を読む</strong><div class="meta"><span>16:12 → 16:27</span><span>見積 15m</span></div></section>
<div class="section">16:00–18:00</div><div class="tasks">
<div class="task done"><div><div class="title">☕ 休憩する</div><div class="meta"><span>15:55–16:05</span><span>実績 10m</span></div><div class="state">✓</div></div></div>
<div class="task"><div><div class="title">📝 今日のメモを整理する</div><div class="meta"><span>10m</span></div><div class="state">○</div></div></div>
<div class="task selected"><div><div class="title">📨 メールを確認する</div><div class="meta"><span>10m</span><span class="repeat">↻</span><span>メモ 1</span></div><div class="actions"><button class="primary">開始</button><button>時刻指定</button><button>メモ</button><button>⋯</button></div><div class="state">○</div></div></div>
<div class="task"><div><div class="title">🚶 散歩する</div><div class="meta"><span>20m</span><span class="repeat">↻</span></div><div class="state">○</div></div></div>
</div>
<div class="section">18:00–21:00</div><div class="tasks">
<div class="task"><div><div class="title">🍳 夕食を準備する</div><div class="meta"><span>30m</span></div><div class="state">○</div></div></div>
<div class="task"><div><div class="title">🧹 部屋を整える</div><div class="meta"><span>15m</span><span class="repeat">↻</span></div><div class="state">○</div></div></div>
<div class="task"><div><div class="title">📚 本を読む</div><div class="meta"><span>20m</span></div><div class="state">○</div></div></div>
</div>
</main>
<div class="note">UI確認用サンプルです。実データ・個人情報・GitHub同期は使用していません。</div>
<div class="shade" id="shade"></div><section class="sheet" id="sheet"><div class="sheet-head"><strong>TaskLiner</strong><button id="close">×</button></div><div class="add"><input placeholder="タスクを追加…"><input type="number" placeholder="分"><button>追加</button></div><div class="grid"><button>前日から持越</button><button>完了 表示/非表示</button><button>セクション</button><button>セクション外→現在</button><button>Master</button><button>Repeat</button><button>Markdown / 詳細</button></div></section>
<script>const body=document.body;document.getElementById('menu').onclick=()=>body.classList.add('open');document.getElementById('shade').onclick=document.getElementById('close').onclick=()=>body.classList.remove('open');document.querySelectorAll('.task').forEach(row=>row.addEventListener('click',e=>{if(e.target.closest('button'))return;document.querySelectorAll('.task').forEach(x=>x.classList.remove('selected'));row.classList.add('selected')}));</script>
</body></html>
