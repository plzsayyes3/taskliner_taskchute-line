<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskLiner V2</title></head><body><p>TaskLinerを読み込んでいます…</p>
<script id="tasklinerMetadataPatch" type="text/plain">
    // Task Master / Repeat / Daily Instance metadata patch.
    html=html.replace(
      "function normalizeTask(t={}){return{id:t.id||uid(),title:String(t.title||'').trim(),estimate:Number(t.estimate)||0,start:t.start||'',end:t.end||'',actualMin:Number(t.actualMin)||0,completed:!!t.completed,deferred:!!t.deferred,skipDate:t.skipDate||'',section:String(t.section||'').trim(),bullet:['-','*','+'].includes(t.bullet)?t.bullet:'-',hadCheckbox:t.hadCheckbox!==false,estimateStyle:t.estimateStyle||'paren',estimateGap:t.estimateGap===undefined?' ':String(t.estimateGap),childLines:Array.isArray(t.childLines)?t.childLines.map(String):[]}}",
      "function normalizeTask(t={}){return{id:t.id||uid(),title:String(t.title||'').trim(),estimate:Number(t.estimate)||0,start:t.start||'',end:t.end||'',actualMin:Number(t.actualMin)||0,completed:!!t.completed,deferred:!!t.deferred,skipDate:t.skipDate||'',section:String(t.section||'').trim(),bullet:['-','*','+'].includes(t.bullet)?t.bullet:'-',hadCheckbox:t.hadCheckbox!==false,estimateStyle:t.estimateStyle||'paren',estimateGap:t.estimateGap===undefined?' ':String(t.estimateGap),childLines:Array.isArray(t.childLines)?t.childLines.map(String):[],masterId:String(t.masterId||''),repeatId:String(t.repeatId||''),plannedAt:String(t.plannedAt||'')}}"
    );

      "let body=m[3].trim();const mark=m[2]===undefined?' ':m[2];let skipDate='';",
      "let body=m[3].trim();const mark=m[2]===undefined?' ':m[2];let masterId='',repeatId='',plannedAt='';const hidden=body.match(/\\s*<!--\\s*tl:([^>]*)-->\\s*$/i);if(hidden){for(const token of hidden[1].trim().split(/\\s+/)){const eq=token.indexOf('=');if(eq<1)continue;const key=token.slice(0,eq),raw=token.slice(eq+1);let value=raw;try{value=decodeURIComponent(raw)}catch{}if(key==='master')masterId=value;else if(key==='repeat')repeatId=value;else if(key==='planned')plannedAt=value}body=body.slice(0,hidden.index).trimEnd()}let skipDate='';"
    );

      "return normalizeTask({title:body,estimate,start,end,actualMin,completed:String(mark).toLowerCase()==='x',deferred:mark==='>'||mark==='<',skipDate,section:currentSection,bullet:m[1],hadCheckbox:m[2]!==undefined,estimateStyle,estimateGap,childLines:[]})}",
      "return normalizeTask({title:body,estimate,start,end,actualMin,completed:String(mark).toLowerCase()==='x',deferred:mark==='>'||mark==='<',skipDate,section:currentSection,bullet:m[1],hadCheckbox:m[2]!==undefined,estimateStyle,estimateGap,childLines:[],masterId,repeatId,plannedAt})}"
    );

      "if(t.skipDate)line+=` [SKIP ${t.skipDate}]`;return line}",
      "if(t.skipDate)line+=` [SKIP ${t.skipDate}]`;const hidden=[];if(t.masterId)hidden.push('master='+encodeURIComponent(t.masterId));if(t.repeatId)hidden.push('repeat='+encodeURIComponent(t.repeatId));if(t.plannedAt)hidden.push('planned='+encodeURIComponent(t.plannedAt));if(hidden.length)line+=' <!-- tl:'+hidden.join(' ')+' -->';return line}"

      "function addNew(){const title=$('newTitle').value.trim();if(!title)return;const masterId=String(window.__tasklinerPendingMasterId||'');window.__tasklinerPendingMasterId='';const task=normalizeTask({title,estimate:Number($('newEstimate').value)||0,section:'',masterId});tasks.unshift(task);"
    );

      "const title=createTaskTitle(t);const meta=document.createElement('div');meta.className='task-meta';if(t.estimate)",
      "const title=createTaskTitle(t);const meta=document.createElement('div');meta.className='task-meta';if(t.repeatId){const repeat=document.createElement('button');repeat.type='button';repeat.className='repeat-badge';repeat.textContent='↻ Repeat';repeat.title='Repeat設定を開く';repeat.onclick=event=>{event.preventDefault();event.stopPropagation();window.top.location.href='./repeat.html?id='+encodeURIComponent(t.repeatId)};meta.append(repeat)}if(t.estimate)"

      "const moved=normalizeTask({...tasks[i],id:uid(),start:'',end:'',actualMin:0,completed:false,deferred:false,skipDate:'',repeatId:'',plannedAt:''});"
    );
    html=html.replace(
      "map(t=>normalizeTask({...t,id:uid(),start:'',end:'',actualMin:0,completed:false,deferred:false,skipDate:''}))",
      "map(t=>normalizeTask({...t,id:uid(),start:'',end:'',actualMin:0,completed:false,deferred:false,skipDate:'',repeatId:'',plannedAt:''}))"
    );
    html=html.replace('</head>','<style id="taskliner-repeat-badge-style">.repeat-badge{border:1px solid var(--line);background:color-mix(in srgb,var(--accent) 8%,var(--panel));color:var(--accent);border-radius:999px;padding:2px 6px;font:700 9px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}.task.running.time-progress-dark .repeat-badge{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(0,0,0,.08)}</style></head>');

<script>
(async()=>{'use strict';try{const r=await fetch(`./taskliner_taskchute-line.html?_v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);let source=await r.text();const anchor='    document.open();document.write(html);document.close();';const patch=document.getElementById('tasklinerMetadataPatch').textContent;if(!source.includes(anchor))throw new Error('runtime patch anchor not found');source=source.replace(anchor,patch);document.open();document.write(source);document.close()}catch(e){document.body.textContent=`TaskLiner V2の読み込みに失敗しました: ${e.message||e}`}})();
</script></body></html>
