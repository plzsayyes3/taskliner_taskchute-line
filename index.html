<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TaskLiner / taskchute-line</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f5f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}#app{display:block;width:100%;height:100%;border:0}.sync-open{position:fixed;right:14px;bottom:14px;z-index:20;border:1px solid #cfd3cd;background:#fff;color:#20211f;border-radius:999px;width:44px;height:44px;padding:0;font-size:21px;line-height:1;font-weight:700;box-shadow:0 6px 22px rgba(0,0,0,.14)}.auto-save-state{position:fixed;right:14px;top:10px;z-index:20;padding:5px 9px;border:1px solid #d9ddd7;background:rgba(255,255,255,.9);color:#6b7069;border-radius:999px;font-size:11px;line-height:1;backdrop-filter:blur(8px);pointer-events:none}.auto-save-state.dirty{color:#9a682f}.auto-save-state.saving{color:#2f5d50}.auto-save-state.error{color:#b24b45}.sync-panel{position:fixed;z-index:30;right:14px;bottom:66px;width:min(390px,calc(100vw - 28px));max-height:calc(100vh - 92px);overflow:auto;background:#fff;color:#20211f;border:1px solid #d9ddd7;border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none}.sync-panel.open{display:block}.sync-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sync-head b{font-size:15px}.sync-head button{border:0;background:transparent;font-size:20px}.settings-section-title{font-size:12px;font-weight:750;margin:2px 0 10px;color:#60655e}.sync-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sync-field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.sync-field.full{grid-column:1/-1}.sync-field label{font-size:11px;color:#6b7069}.sync-field input{width:100%;box-sizing:border-box;border:1px solid #d9ddd7;background:#f7f8f5;color:#20211f;border-radius:9px;padding:8px 9px;font:inherit;font-size:13px}.sync-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.sync-actions button{border:1px solid #d9ddd7;background:#f7f8f5;color:#20211f;border-radius:9px;padding:8px 10px;font-weight:650}.sync-actions .primary{background:#2f5d50;color:#fff;border-color:#2f5d50}.sync-status{font-size:12px;color:#60655e;margin-top:10px;min-height:18px}.sync-note{font-size:11px;line-height:1.5;color:#777d75;margin-top:10px;padding-top:9px;border-top:1px solid #eceeea}.warn{color:#9a4c2f;font-weight:650}.ok{color:#2f6d55;font-weight:650}@media(prefers-color-scheme:dark){html,body{background:#151714}.sync-open,.sync-panel{background:#1d201c;color:#eceee8;border-color:#343931}.auto-save-state{background:rgba(29,32,28,.9);color:#a1a59c;border-color:#343931}.auto-save-state.dirty{color:#d8b477}.auto-save-state.saving{color:#8fc0ae}.auto-save-state.error{color:#ef9393}.sync-field input,.sync-actions button{background:#151714;color:#eceee8;border-color:#343931}.sync-field label,.sync-status,.sync-note,.settings-section-title{color:#a1a59c}.sync-note{border-color:#343931}.sync-actions .primary{background:#527d6e;color:#fff}.warn{color:#e6a17f}.ok{color:#8fc0ae}}@media(max-width:520px){.sync-panel{right:8px;bottom:62px;width:calc(100vw - 16px);max-height:72vh}.sync-open{right:10px;bottom:10px}.auto-save-state{right:10px;top:8px}.sync-grid{grid-template-columns:1fr}.sync-field.full{grid-column:auto}}
</style>
</head>
<body>
<iframe id="app" src="./taskliner_taskchute-line.html" title="TaskLiner"></iframe>
<div id="autoSaveState" class="auto-save-state">保存済み</div>
<button id="syncOpen" class="sync-open" aria-label="設定を開く" title="設定">⚙</button>
<section id="syncPanel" class="sync-panel" aria-label="TaskLiner設定">
  <div class="sync-head"><b>設定</b><button id="syncClose" aria-label="閉じる">×</button></div>
  <div class="settings-section-title">GitHub同期</div>
  <div class="sync-grid">
    <div class="sync-field full"><label>Fine-grained token</label><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_... または ghp_..."></div>
    <div class="sync-field full"><label>Repository (owner/repo)</label><input id="ghRepo" value="plzsayyes3/mynotebook"></div>
    <div class="sync-field"><label>Branch</label><input id="ghBranch" value="task-data"></div>
    <div class="sync-field"><label>Folder</label><input id="ghFolder" value="09_taskchute"></div>
  </div>
  <div class="sync-actions">
    <button id="ghCheck">接続確認</button>
    <button id="ghLoad">GitHubから読込</button>
    <button id="ghSave" class="primary">GitHubへ保存</button>
    <button id="ghForget">Tokenを消去</button>
  </div>
  <div id="ghStatus" class="sync-status">未接続</div>
  <div class="sync-note">Tokenはこのブラウザの <code>localStorage</code> に保存し、リポジトリやHTMLには書き込みません。必要権限は保存先Repositoryの <b>Contents: Read and write</b> です。<br><span id="repoPrivacy">RepositoryとBranchの状態は「接続確認」で確認します。</span></div>
</section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),frame=$('app'),panel=$('syncPanel');
const CONFIG_KEY='taskliner_github_sync_config_v1',TOKEN_KEY='taskliner_github_sync_token_v1',DIRTY_KEY='taskliner_github_dirty_dates_v1';
const TASK_PREFIX='taskliner_taskchute_line_v1:',DOCUMENT_PREFIX='taskliner_taskchute_line_document_v1:';
const AUTO_SAVE_DELAY=3*60*1000;
const knownSha=new Map();
let dirtyDates=loadDirtyDates(),dirtyVersion=new Map(),autoTimer=null,saveInFlight=null,navigationPending=false,suppressDirty=false;
function status(text,isError=false){const el=$('ghStatus');el.textContent=text;el.style.color=isError?'#b24b45':''}
function saveState(text,kind=''){const el=$('autoSaveState');el.textContent=text;el.className=`auto-save-state${kind?` ${kind}`:''}`}
function config(){return{repo:$('ghRepo').value.trim(),branch:$('ghBranch').value.trim()||'task-data',folder:$('ghFolder').value.trim().replace(/^\/+|\/+$/g,''),token:$('ghToken').value.trim()}}
function saveConfig(){const c=config();localStorage.setItem(CONFIG_KEY,JSON.stringify({repo:c.repo,branch:c.branch,folder:c.folder}));if(c.token)localStorage.setItem(TOKEN_KEY,c.token)}
function restoreConfig(){try{const c=JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}');if(c.repo)$('ghRepo').value=c.repo;if(c.branch)$('ghBranch').value=c.branch;if(c.folder!==undefined)$('ghFolder').value=c.folder}catch{}$('ghToken').value=localStorage.getItem(TOKEN_KEY)||''}
function loadDirtyDates(){try{return new Set(JSON.parse(localStorage.getItem(DIRTY_KEY)||'[]'))}catch{return new Set()}}
function persistDirtyDates(){localStorage.setItem(DIRTY_KEY,JSON.stringify([...dirtyDates]))}
function activeDate(){try{return(frame.contentDocument.getElementById('dateBtn').textContent||'').trim().slice(0,10)}catch{return''}}
function markdownBox(){try{return frame.contentDocument.getElementById('markdownBox')}catch{return null}}
function importButton(){try{return frame.contentDocument.getElementById('importMdBtn')}catch{return null}}
function recognizedSections(){try{return frame.contentDocument.querySelectorAll('#sectionMenu .section-menu-list button').length}catch{return 0}}
function filePath(date=activeDate()){const c=config();if(!date)throw new Error('日付を取得できません');return c.folder?`${c.folder}/${date}.md`:`${date}.md`}
function splitRepo(repo){const p=repo.split('/').filter(Boolean);if(p.length!==2)throw new Error('Repositoryは owner/repo 形式で入力してください');return p}
function headers(){const token=config().token;if(!token)throw new Error('Tokenを入力してください');return{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
function toBase64(text){const bytes=new TextEncoder().encode(text);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}
function fromBase64(text){const binary=atob(String(text||'').replace(/\n/g,'')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function endpoint(path=''){const c=config(),[owner,repo]=splitRepo(c.repo);return`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}${path}`}
async function fetchJson(path=''){const r=await fetch(endpoint(path),{headers:headers()});if(!r.ok){const d=await r.json().catch(()=>({}));const e=new Error(d.message||`GitHub API ${r.status}`);e.status=r.status;throw e}return r.json()}
async function repoMeta(){return fetchJson('')}
async function ensureBranch(){const branch=config().branch;try{return await fetchJson(`/branches/${encodeURIComponent(branch)}`)}catch(e){if(e.status===404)throw new Error(`Branch「${branch}」がありません。Branch名かTokenのRepositoryアクセス範囲を確認してください。`);throw e}}
async function getRemote(path){const c=config();const url=endpoint(`/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(c.branch)}`);const r=await fetch(url,{headers:headers()});if(r.status===404)return null;if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||`GitHub API ${r.status}`)}return r.json()}
function showPrivacy(meta){const el=$('repoPrivacy');if(meta.private){el.className='ok';el.textContent='保存先は private repository です。'}else{el.className='warn';el.textContent='保存先は public repository です。タスク内容も公開されます。'}}
function refreshSaveState(){const date=activeDate();if(!date)return;if(dirtyDates.has(date)){saveState('未保存','dirty');scheduleAutoSave()}else saveState('保存済み')}
function scheduleAutoSave(){clearTimeout(autoTimer);const date=activeDate();if(!date||!dirtyDates.has(date))return;autoTimer=setTimeout(()=>{if(document.visibilityState==='visible')saveRemote({interactive:false,reason:'idle'})},AUTO_SAVE_DELAY)}
function markDirty(date){if(suppressDirty||!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return;dirtyDates.add(date);dirtyVersion.set(date,(dirtyVersion.get(date)||0)+1);persistDirtyDates();if(date===activeDate()){saveState('未保存','dirty');scheduleAutoSave()}}
function markClean(date){dirtyDates.delete(date);persistDirtyDates();if(date===activeDate()){clearTimeout(autoTimer);saveState('保存済み')}}
async function check(){saveConfig();status('Repository / Branch を確認中…');try{const meta=await repoMeta();await ensureBranch();showPrivacy(meta);status(`接続OK: ${meta.full_name} / ${config().branch} / ${meta.private?'private':'public'}`)}catch(e){$('repoPrivacy').className='';$('repoPrivacy').textContent='接続確認に失敗しています。';status(`接続失敗: ${e.message}`,true)}}
async function loadRemote(){saveConfig();status('GitHubから読込中…');try{await ensureBranch();const date=activeDate(),path=filePath(date),d=await getRemote(path);if(!d){status(`${path} はまだありません`);return}if(!d.content)throw new Error('ファイル内容を取得できません');const box=markdownBox(),button=importButton();if(!box||!button)throw new Error('TaskLiner画面へ接続できません');const text=fromBase64(d.content);box.value=text;knownSha.set(`${config().repo}|${config().branch}|${path}`,d.sha);const win=frame.contentWindow,originalConfirm=win.confirm;suppressDirty=true;win.confirm=()=>true;try{button.click()}finally{win.confirm=originalConfirm;suppressDirty=false}const sections=recognizedSections(),rawSections=(text.match(/^\s*##\s+.+$/gm)||[]).length;if(rawSections>0&&sections===0)throw new Error(`Markdownには${rawSections}個のセクションがありますが、画面側で認識できませんでした`);markClean(date);status(`${path} を読み込みました（${sections}セクション認識）`)}catch(e){status(`読込失敗: ${e.message}`,true);saveState('読込失敗','error')}}
async function performSave({interactive=true,reason='manual'}={}){saveConfig();const date=activeDate(),box=markdownBox();if(!date)throw new Error('日付を取得できません');if(!box)throw new Error('TaskLiner画面へ接続できません');const path=filePath(date),content=box.value.replace(/\s+$/,'')+'\n',version=dirtyVersion.get(date)||0;status(reason==='manual'?'GitHubへ保存中…':'自動保存中…');saveState('保存中…','saving');await ensureBranch();const current=await getRemote(path),key=`${config().repo}|${config().branch}|${path}`,known=knownSha.get(key);if(current&&known&&current.sha!==known){if(!interactive)throw Object.assign(new Error('GitHub上に別の更新があります'),{code:'conflict'});if(!confirm('GitHub上のファイルが前回読込後に更新されています。上書きしますか？')){status('保存を中止しました');refreshSaveState();return false}}if(current&&!known){if(!interactive)throw Object.assign(new Error('GitHub上の既存ファイルを先に読み込んでください'),{code:'conflict'});if(!confirm('GitHub上に既存ファイルがあります。現在の画面内容で上書きしますか？')){status('保存を中止しました');refreshSaveState();return false}}const c=config(),body={message:`Update TaskLiner ${date}`,content:toBase64(content),branch:c.branch};if(current)body.sha=current.sha;const url=endpoint(`/contents/${path.split('/').map(encodeURIComponent).join('/')}`),r=await fetch(url,{method:'PUT',headers:headers(),body:JSON.stringify(body)});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||`GitHub API ${r.status}`)}const d=await r.json();if(d.content&&d.content.sha)knownSha.set(key,d.content.sha);if((dirtyVersion.get(date)||0)===version){markClean(date);status(`${path} を保存しました`);saveState(reason==='navigation'?'保存しました':'保存済み');return true}status(`${path} を保存しましたが、新しい変更があります`);saveState('未保存','dirty');scheduleAutoSave();return false}
async function saveRemote(options={}){if(saveInFlight)return saveInFlight;saveInFlight=performSave(options).catch(e=>{const conflict=e&&e.code==='conflict';status(`${conflict?'競合':'保存失敗'}: ${e.message}`,true);saveState(conflict?'競合あり':'保存失敗','error');return false}).finally(()=>{saveInFlight=null});return saveInFlight}
function storageDateFromKey(key){if(String(key).startsWith(TASK_PREFIX))return String(key).slice(TASK_PREFIX.length);if(String(key).startsWith(DOCUMENT_PREFIX))return String(key).slice(DOCUMENT_PREFIX.length);return''}
function bindFrame(){let win,doc;try{win=frame.contentWindow;doc=frame.contentDocument}catch{return}if(!win||!doc||win.__tasklinerAutoSaveBound)return;win.__tasklinerAutoSaveBound=true;const proto=win.Storage&&win.Storage.prototype;if(proto&&!proto.__tasklinerAutoSavePatched){const original=proto.setItem;Object.defineProperty(proto,'__tasklinerAutoSavePatched',{value:true});proto.setItem=function(key,value){const result=original.call(this,key,value);try{if(this===win.localStorage){const date=storageDateFromKey(key);if(date)markDirty(date)}}catch{}return result}}let bypassNavigation=false;doc.addEventListener('click',e=>{const nav=e.target.closest&&e.target.closest('#prevDay,#nextDay,#todayBtn,#dateBtn');if(!nav||bypassNavigation||navigationPending)return;const date=activeDate();if(!dirtyDates.has(date))return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();navigationPending=true;(async()=>{const ok=await saveRemote({interactive:false,reason:'navigation'});if(!ok){navigationPending=false;return}saveState('保存しました');setTimeout(()=>{bypassNavigation=true;try{nav.click()}finally{bypassNavigation=false;navigationPending=false}setTimeout(refreshSaveState,0)},1000)})()},true);refreshSaveState()}
frame.addEventListener('load',bindFrame);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirtyDates.has(activeDate()))saveRemote({interactive:false,reason:'visibility'})});
$('syncOpen').onclick=()=>{panel.classList.add('open');restoreConfig()};$('syncClose').onclick=()=>panel.classList.remove('open');$('ghCheck').onclick=check;$('ghLoad').onclick=loadRemote;$('ghSave').onclick=()=>saveRemote({interactive:true,reason:'manual'});$('ghForget').onclick=()=>{localStorage.removeItem(TOKEN_KEY);$('ghToken').value='';status('Tokenを消去しました')};['ghRepo','ghBranch','ghFolder'].forEach(id=>$(id).addEventListener('change',()=>{saveConfig();knownSha.clear();$('repoPrivacy').className='';$('repoPrivacy').textContent='RepositoryとBranchの状態は「接続確認」で確認します。'}));$('ghToken').addEventListener('change',saveConfig);restoreConfig();
})();
</script>
</body>
</html>
