$('addTask').onclick=addNew;$('newTitle').addEventListener('keydown',e=>{if(e.key==='Enter')addNew()});$('newEstimate').addEventListener('keydown',e=>{if(e.key==='Enter')addNew()});function requestDateChange(targetDate){if(!/^\d{4}-\d{2}-\d{2}$/.test(targetDate||''))return;if(window.top===window.self){activeDate=targetDate;load();return}window.top.postMessage({source:'taskliner',type:'navigation-request',fromDate:activeDate,targetDate},'*')}window.addEventListener('message',event=>{const msg=event.data;if(!msg||msg.source!=='taskliner-host'||msg.type!=='navigation-continue')return;activeDate=msg.targetDate;load();notifyHost('date-changed',{date:activeDate})});$('prevDay').onclick=()=>requestDateChange(shiftDate(activeDate,-1));$('nextDay').onclick=()=>requestDateChange(shiftDate(activeDate,1));$('todayBtn').onclick=()=>requestDateChange(todayStr());$('dateBtn').onclick=()=>{const v=prompt('日付を YYYY-MM-DD で入力',activeDate);if(/^\d{4}-\d{2}-\d{2}$/.test(v||''))requestDateChange(v)};
$('carryBtn').onclick=()=>{const prev=shiftDate(activeDate,-1),prevState=readStoredDate(prev);const carry=prevState.tasks.filter(t=>stateOf(t)!=='done').map(t=>normalizeTask({...t,id:uid(),start:'',end:'',actualMin:0,completed:false,deferred:false,skipDate:''}));if(!carry.length){toast('持ち越すタスクはありません');return}for(const t of carry){tasks.push(t);insertTaskNode(t)}save();toast(`${carry.length}件を持ち越しました`)};
$('doneToggleBtn').onclick=()=>{hideDone=!hideDone;localStorage.setItem(HIDE_DONE_KEY,hideDone?'1':'0');render();toast(hideDone?'完了済みタスクを非表示にしました':'完了済みタスクを表示しました')};$('sectionBtn').onclick=e=>{e.stopPropagation();$('sectionMenu').classList.toggle('open')};document.addEventListener('click',e=>{const menu=$('sectionMenu');if(!menu.contains(e.target)&&e.target!==$('sectionBtn'))menu.classList.remove('open')});$('copyMdBtn').onclick=async()=>{const text=exportMarkdown();try{await navigator.clipboard.writeText(text);toast('Markdownをコピーしました')}catch{$('markdownBox').value=text;$('markdownBox').select();document.execCommand('copy');toast('Markdownをコピーしました')}};$('downloadMdBtn').onclick=()=>{const blob=new Blob([exportMarkdown()+'\n'],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${activeDate}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importMdBtn').onclick=()=>{const parsed=parseMarkdown($('markdownBox').value);if(!parsed.tasks.length){toast('取り込めるタスク行がありません');return}if(tasks.length&&!confirm('現在日のタスクをMarkdown内容で置き換えますか？'))return;tasks=parsed.tasks;documentNodes=parsed.nodes;save();toast(`${tasks.length}件を取り込みました`)};setInterval(updateLiveDisplay,1000);
function createTaskRow(t,index){
  const s=stateOf(t),selected=selectedTaskId===t.id,row=document.createElement('article');
  row.className=`task ${s}${selected?' task-selected':''}`;row.dataset.taskId=t.id;
  row.onclick=e=>{if(e.target.closest('button,summary,details'))return;if(selectedTaskId!==t.id)selectTask(t.id)};
  const status=document.createElement('button');status.className='status-btn';status.innerHTML=statusIcon(t);status.title=s==='todo'?'開始':s==='running'?'終了':s==='done'?'保留にする':'リセット';status.setAttribute('aria-label',status.title);status.onclick=e=>{e.stopPropagation();if(s==='todo')startTask(t.id);else if(s==='running')endTask(t.id);else if(s==='done')deferTask(t.id);else resetTask(t.id)};
  const main=document.createElement('div');main.className='task-main';const title=createTaskTitle(t);
  const meta=document.createElement('div');meta.className='task-meta';if(t.estimate)meta.append(span(`見積 ${t.estimate}m`));if(t.start){meta.append(span(`開始 ${t.start}`));const expected=t.estimate>0?addMinutesToClock(t.start,t.estimate):'';if(s==='running'&&expected)meta.append(span(`終了見込 ${expected}`))}if(t.end)meta.append(span(`終了 ${t.end}`));if(t.start&&t.end)meta.append(span(`実績 ${t.actualMin||elapsed(t.start,t.end)}m`));if(t.deferred)meta.append(span('保留'));
  const actions=document.createElement('div');actions.className='task-actions';const defs=UI.availableDefinitions(visibleActionKeys,s);const addAction=(key,handler,cls='',disabled=false)=>{const def=defs.find(x=>x.key===key);if(!def)return;const b=btn(def.label,handler,disabled,cls);b.title=def.title;b.setAttribute('aria-label',def.title);actions.append(b)};
  if(s==='running')addAction('complete',()=>endTask(t.id),'primary-action');if(s==='done')addAction('complete',()=>resetTask(t.id));if(s==='todo'||s==='deferred'){addAction('start',()=>startTask(t.id),'primary-action');addAction('time',()=>startTaskAt(t.id));addAction('previous',()=>startTask(t.id,true));}if(s==='running'){addAction('end',()=>endTask(t.id),'primary-action');addAction('time',()=>endTaskAt(t.id));}addAction('defer',()=>deferTask(t.id));addAction('tomorrow',()=>moveTomorrow(t.id));const globalIndex=tasks.findIndex(x=>x.id===t.id);addAction('up',()=>moveTask(t.id,-1),'move-action',globalIndex===0);addAction('down',()=>moveTask(t.id,1),'move-action',globalIndex===tasks.length-1);addAction('delete',()=>deleteTask(t.id),'delete-action');
  const more=defs.find(x=>x.key==='more');if(more){const details=document.createElement('details');details.className='task-more';const summary=document.createElement('summary');summary.textContent=more.label;summary.title=more.title;summary.setAttribute('aria-label',more.title);const menu=document.createElement('div');menu.className='task-more-menu';const menuAction=(key,handler)=>{const def=defs.find(x=>x.key===key);if(!def)return;const b=btn(def.title,handler);b.title=def.title;b.setAttribute('aria-label',def.title);menu.append(b)};if(s==='todo'||s==='deferred'){const completion=btn('完了のみ',()=>markDone(t.id));completion.title='時刻を記録せず完了';completion.setAttribute('aria-label',completion.title);menu.append(completion)}if(s!=='todo')menuAction('start',()=>resetTask(t.id));menuAction('end',()=>changeExpectedEnd(t.id));menuAction('defer',()=>deferTask(t.id));menuAction('tomorrow',()=>moveTomorrow(t.id));details.append(summary,menu);actions.append(details)}
  main.append(title,meta,actions);row.append(status,main);return row;
}
const normalizeTaskBase=normalizeTask;normalizeTask=function(t){const clean={...t,title:window.TaskLinerMarkdown?.stripTaskMetadata?window.TaskLinerMarkdown.stripTaskMetadata(t.title):String(t.title||'').replace(/\s*<!--\s*tl:[^>]*-->\s*$/i,'').trimEnd()};return{...normalizeTaskBase(clean),repeatId:String(t.repeatId||''),masterId:String(t.masterId||''),plannedAt:String(t.plannedAt||'')}};
const richMarkdown=window.TaskLinerMarkdown;parseTaskLine=function(raw,currentSection){const parsed=richMarkdown.parseTaskLine(raw,currentSection);return parsed?normalizeTask(parsed):null};
const parseMarkdownBase=parseMarkdown;parseMarkdown=function(text){const parsed=parseMarkdownBase(text);for(const task of parsed.tasks){const match=String(task.title||'').match(/\s*<!--\s*tl:([^>]*)-->\s*$/i);if(!match)continue;for(const token of match[1].trim().split(/\s+/)){const i=token.indexOf('=');if(i<1)continue;const key=token.slice(0,i),value=decodeURIComponent(token.slice(i+1));if(key==='repeat')task.repeatId=value;if(key==='master')task.masterId=value;if(key==='planned')task.plannedAt=value}task.title=task.title.slice(0,match.index).trimEnd()}return parsed};
const taskToMarkdownBase=taskToMarkdown;taskToMarkdown=function(t){let line=taskToMarkdownBase(t).replace(/(?:\s*<!--\s*tl:[^>]*-->)+\s*$/i,'').trimEnd();const parts=[];if(t.masterId)parts.push(`master=${encodeURIComponent(t.masterId)}`);if(t.repeatId)parts.push(`repeat=${encodeURIComponent(t.repeatId)}`);if(t.plannedAt)parts.push(`planned=${encodeURIComponent(t.plannedAt)}`);return parts.length?`${line} <!-- tl:${parts.join(' ')} -->`:line};
function appendTaskLinkedText(root,text){const source=String(text||''),pattern=/\[\[([^\]]+)\]\]|\[([^\]]+)\]\(([^)\s]+)\)|((?:https?:\/\/|[a-z][a-z0-9+.-]*:\/\/)[^\s<]+)/gi;let last=0,match;const safe=value=>value&&!/^(javascript|data|vbscript):/i.test(value)?value:'';while((match=pattern.exec(source))){if(match.index>last)root.append(document.createTextNode(source.slice(last,match.index)));if(match[1]!==undefined){const raw=match[1].trim(),pipe=raw.indexOf('|'),target=(pipe>=0?raw.slice(0,pipe):raw).split('#')[0].trim(),alias=(pipe>=0?raw.slice(pipe+1):'').trim(),label=alias||target.split('/').pop()||target;const node=document.createElement('span');node.textContent=label;node.title=`[[${raw}]]`;root.append(node)}else{const target=safe(match[3]||match[4]),label=match[2]||match[4];if(target){const link=document.createElement('a');link.href=target;link.textContent=label;link.title=target;if(/^https?:\/\//i.test(target)){link.target='_blank';link.rel='noopener noreferrer'}link.onclick=e=>e.stopPropagation();root.append(link)}else root.append(document.createTextNode(match[0]))}last=pattern.lastIndex}if(last<source.length)root.append(document.createTextNode(source.slice(last)));return root}
function createTaskTitle(t){const wrap=document.createElement('div');wrap.className='task-title-wrap';const view=document.createElement('div');view.className='task-title-rich';view.title='ダブルクリックで編集';appendTaskLinkedText(view,t.title);const editor=document.createElement('input');editor.className='task-title-editor';editor.value=t.title;editor.hidden=true;view.ondblclick=()=>{view.hidden=true;editor.hidden=false;editor.focus();editor.select()};editor.onblur=()=>{const next=editor.value.trim();if(next)t.title=next;view.hidden=false;editor.hidden=true;save()};wrap.append(view,editor);return wrap}
const createTaskRowBase=createTaskRow;createTaskRow=function(t,index){const row=createTaskRowBase(t,index),meta=row.querySelector('.task-meta');if(meta&&t.repeatId){const marker=document.createElement('span');marker.className='repeat-marker';marker.textContent='↻';marker.title='繰り返し';marker.setAttribute('aria-label','繰り返し');meta.append(marker)}return row};
ensureActionSettingsUI();load();
