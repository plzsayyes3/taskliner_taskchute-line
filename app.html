<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TaskLiner / taskchute-line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f2;--panel:#fff;--text:#20211f;--muted:#777a73;--line:#dedfd9;
  --accent:#2f5d50;--danger:#a23d3d;--running:#fff6d7;--done:#f0f1ed;
  --deferred:#f4eef8;--shadow:0 8px 24px rgba(0,0,0,.045)
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"M PLUS 1p",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:960px;margin:0 auto;padding:10px 14px 80px}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);padding:7px 0 10px}
.topline{display:flex;align-items:baseline;gap:14px;min-height:34px;padding-right:190px}
.brand{font-size:15px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.clock{font-size:25px;font-weight:650;letter-spacing:.025em;font-variant-numeric:tabular-nums;line-height:1;color:var(--text)}
.datebar{display:flex;align-items:center;gap:6px;margin-top:7px}
.datebar button,.toolbar button,.task-actions button,.status-btn,.section-head button,.section-menu button,.current-end{
  border:1px solid var(--line);background:var(--panel);border-radius:9px
}
.datebar button{height:32px;padding:5px 9px}
.datebar .arrow{width:36px;padding:0;font-size:15px}
.date-btn{min-width:150px;font-weight:700;text-align:center}
.today-btn{font-size:12px;color:var(--muted)}
.today-mark{font-size:9px;color:var(--muted);margin-left:6px;font-weight:600}
.summary-line{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;padding-left:2px;color:var(--muted);font-size:11px}
.summary-line span{display:flex;align-items:baseline;gap:4px}
.summary-line b{color:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:10px;margin:4px 0 10px}
.current,.add{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.current{padding:11px 12px}
.current-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.current .label,.add-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.current-elapsed{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.current-main{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin-top:4px}
.current .title{font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.current .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;margin-top:3px}
.current-end{padding:6px 12px;font-size:12px;font-weight:750;color:var(--accent)}
.current-end[hidden]{display:none}
.add{padding:10px}
.add-label{margin:0 2px 6px}
.add-form{display:grid;grid-template-columns:1fr 76px auto;gap:6px}
.add input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:13px}
.primary{border:none!important;background:var(--accent)!important;color:white!important;font-weight:750}
.estimate{text-align:center}
.add .primary{border-radius:8px;padding:7px 12px;font-size:12px}
.toolbar-wrap{position:relative}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 11px}
.toolbar button{padding:6px 9px;font-size:11px;color:var(--muted)}
.toolbar button.active{color:var(--accent);font-weight:700}
.tasks{display:flex;flex-direction:column;gap:7px}
.section-block{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.section-block:first-child{margin-top:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 2px 1px}
.section-title{font-size:12px;font-weight:750;letter-spacing:.02em;color:var(--muted)}
.section-head button{padding:3px 7px;font-size:10px;color:var(--muted);background:transparent}
.task{display:grid;grid-template-columns:auto 1fr;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;box-shadow:var(--shadow)}
.task.running{background:var(--running)}
.task.done{background:var(--done);opacity:.82}
.task.deferred{background:var(--deferred)}
.status-btn{align-self:start;min-width:42px;padding:6px 7px;font-size:12px;font-weight:800}
.task-main{min-width:0}
.task-title{width:100%;border:0;background:transparent;padding:1px 0;font-weight:650;outline:none}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
.task-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px}
.task-actions button{padding:4px 7px;font-size:11px}
.task-actions .primary-action{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent);font-weight:700}
.task-actions .move-action{min-width:30px;padding-left:6px;padding-right:6px;font-weight:750}
.task-actions .delete-action{color:var(--danger)}
.task-more{position:relative}
.task-more summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:11px;color:var(--muted);user-select:none}
.task-more summary::-webkit-details-marker{display:none}
.task-more-menu{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.task-more-menu .danger{color:var(--danger)}
.section-menu{position:absolute;z-index:20;left:0;top:calc(100% - 5px);width:min(320px,calc(100vw - 28px));padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none}
.section-menu.open{display:block}
.section-menu-title{font-size:11px;color:var(--muted);margin:0 2px 8px}
.section-menu-list{display:flex;flex-direction:column;gap:6px}
.section-menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 9px;text-align:left;font-size:12px}
.section-menu button.hidden-section{opacity:.58}
.section-menu .all-show{margin-top:8px;justify-content:center}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:12px}
.raw{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.raw summary{cursor:pointer;color:var(--muted);font-size:11px}
.raw-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.raw-actions button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--muted)}
.raw textarea{width:100%;min-height:220px;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1}
@media(max-width:720px){
  .app{padding:8px 10px 70px}
  .topline{padding-right:155px;gap:10px}
  .brand{font-size:13px}
  .clock{font-size:22px}
  .workspace{grid-template-columns:1fr}
  .add-form{grid-template-columns:1fr 74px auto}
}
@media(max-width:520px){
  .topline{padding-right:142px}
  .date-btn{min-width:0;flex:1}
  .summary-line{gap:9px}
  .current-main{grid-template-columns:1fr auto}
  .add-form{grid-template-columns:1fr 72px}
  .add .primary{grid-column:1/-1}
  .task{grid-template-columns:40px 1fr}
  .section-menu{position:fixed;left:10px;right:10px;bottom:10px;top:auto;width:auto;max-height:60vh;overflow:auto}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topline">
      <div class="brand">TaskLiner</div>
      <div id="nowClock" class="clock">--:--:--</div>
    </div>
    <div class="datebar">
      <button id="prevDay" class="arrow" aria-label="前日">‹</button>
      <button id="dateBtn" class="date-btn"></button>
      <button id="nextDay" class="arrow" aria-label="翌日">›</button>
      <button id="todayBtn" class="today-btn">今日</button>
    </div>
    <div class="summary-line" aria-label="今日の進捗">
      <span><b id="doneCount">0/0</b> 完了</span>
      <span><b id="progressPct">0%</b> 進捗</span>
      <span><b id="recordedMin">0m</b> 実績</span>
      <span><b id="remainingMin">0m</b> 残り</span>
    </div>
  </header>

  <div class="workspace">
    <section class="current">
      <div class="current-head">
        <div class="label">実行中</div>
        <div id="currentElapsed" class="current-elapsed">--:--:--</div>
      </div>
      <div class="current-main">
        <div>
          <div id="currentTitle" class="title">待機中</div>
          <div id="currentTime" class="time">実行中のタスクはありません</div>
        </div>
        <button id="currentEndBtn" class="current-end" type="button" hidden>終了</button>
      </div>
    </section>

    <section class="add">
      <div class="add-label">タスク追加</div>
      <div class="add-form">
        <input id="newTitle" type="text" placeholder="次にやること…" autocomplete="off">
        <input id="newEstimate" class="estimate" type="number" min="0" step="5" placeholder="分">
        <button id="addTask" class="primary">追加</button>
      </div>
    </section>
  </div>

  <div class="toolbar-wrap">
    <div class="toolbar">
      <button id="carryBtn">前日から持越</button>
      <button id="doneToggleBtn">完了を非表示</button>
      <button id="sectionBtn">セクション</button>
    </div>
    <div id="sectionMenu" class="section-menu" aria-label="セクション表示設定"></div>
  </div>

  <main id="tasks" class="tasks"></main>

  <details class="raw">
    <summary>Markdown / 詳細</summary>
    <div class="raw-actions">
      <button id="copyMdBtn">コピー</button>
      <button id="downloadMdBtn">.md保存</button>
      <button id="importMdBtn">Markdown取込</button>
    </div>
    <textarea id="markdownBox" spellcheck="false"></textarea>
  </details>
</div>
<div id="toast" class="toast"></div>

<script>
(()=>{'use strict';

const STORAGE_PREFIX='taskliner_taskchute_line_v1:';
const DOCUMENT_PREFIX='taskliner_taskchute_line_document_v1:';
const HIDDEN_SECTIONS_KEY='taskliner_taskchute_line_hidden_sections_v1';
const HIDE_DONE_KEY='taskliner_taskchute_line_hide_done_v1';
const $=id=>document.getElementById(id);

let activeDate=todayStr();
let tasks=[];
let documentNodes=[];
let hiddenSections=loadHiddenSections();
let hideDone=localStorage.getItem(HIDE_DONE_KEY)==='1';

function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function shiftDate(dateStr,delta){const[y,m,d]=dateStr.split('-').map(Number),dt=new Date(y,m-1,d,12);dt.setDate(dt.getDate()+delta);return`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`}
function nowTime(){const d=new Date();return`${pad(d.getHours())}:${pad(d.getMinutes())}`}
function nowTimeSeconds(){const d=new Date();return`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function minutesOf(t){if(!/^\d{1,2}:\d{2}$/.test(t||''))return null;const[h,m]=t.split(':').map(Number);return h*60+m}
function elapsed(start,end){const a=minutesOf(start),b=minutesOf(end);if(a===null||b===null)return 0;let n=b-a;if(n<0)n+=1440;return n}
function liveElapsedSeconds(start){
  const a=minutesOf(start);
  if(a===null)return null;
  const d=new Date();
  let n=d.getHours()*3600+d.getMinutes()*60+d.getSeconds()-a*60;
  if(n<0)n+=86400;
  return n
}
function formatDurationSeconds(total){
  total=Math.max(0,Math.floor(Number(total)||0));
  const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
  return`${pad(h)}:${pad(m)}:${pad(s)}`
}
function uid(){return`${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`}
function stateOf(t){if(t.deferred)return'deferred';if(t.completed||t.start&&t.end)return'done';if(t.start)return'running';return'todo'}
function normalizeTask(t={}){
  return{
    id:t.id||uid(),
    title:String(t.title||'').trim(),
    estimate:Number(t.estimate)||0,
    start:t.start||'',
    end:t.end||'',
    actualMin:Number(t.actualMin)||0,
    completed:!!t.completed,
    deferred:!!t.deferred,
    skipDate:t.skipDate||'',
    section:String(t.section||'').trim(),
    bullet:['-','*','+'].includes(t.bullet)?t.bullet:'-',
    hadCheckbox:t.hadCheckbox!==false,
    estimateStyle:t.estimateStyle||'paren',
    estimateGap:t.estimateGap===undefined?' ':String(t.estimateGap),
    childLines:Array.isArray(t.childLines)?t.childLines.map(String):[]
  }
}

function loadHiddenSections(){try{return new Set(JSON.parse(localStorage.getItem(HIDDEN_SECTIONS_KEY)||'[]'))}catch{return new Set()}}
function saveHiddenSections(){localStorage.setItem(HIDDEN_SECTIONS_KEY,JSON.stringify([...hiddenSections]))}
function sectionNames(){const result=[];for(const t of tasks){if(t.section&&!result.includes(t.section))result.push(t.section)}return result}
function hideSection(name){if(!name)return;hiddenSections.add(name);saveHiddenSections();render();toast(`「${name}」を非表示にしました`)}
function toggleSection(name){if(hiddenSections.has(name))hiddenSections.delete(name);else hiddenSections.add(name);saveHiddenSections();render()}
function showAllSections(){hiddenSections.clear();saveHiddenSections();render();toast('すべてのセクションを表示しました')}

function canonicalNodesFromTasks(items){
  const nodes=[];let currentSection=null;
  for(const t of items){
    if(t.section!==currentSection){
      if(t.section){
        if(nodes.length&&!(nodes[nodes.length-1].type==='raw'&&nodes[nodes.length-1].text===''))nodes.push({type:'raw',text:''});
        nodes.push({type:'raw',text:`## ${t.section}`})
      }
      currentSection=t.section
    }
    nodes.push({type:'task',id:t.id})
  }
  return nodes
}
function validNodes(value){return Array.isArray(value)&&value.every(n=>n&&((n.type==='raw'&&typeof n.text==='string')||(n.type==='task'&&typeof n.id==='string')))}
function ensureTaskNodes(){
  const currentIds=new Set(tasks.map(t=>t.id));
  documentNodes=documentNodes.filter(n=>n.type==='raw'||currentIds.has(n.id));
  const nodeIds=new Set(documentNodes.filter(n=>n.type==='task').map(n=>n.id));
  for(const t of tasks){if(!nodeIds.has(t.id))insertTaskNode(t,documentNodes,tasks)}
}
function load(){
  try{
    const stored=JSON.parse(localStorage.getItem(STORAGE_PREFIX+activeDate)||'[]');
    tasks=(Array.isArray(stored)?stored:stored&&Array.isArray(stored.tasks)?stored.tasks:[]).map(normalizeTask)
  }catch{tasks=[]}
  try{
    const storedNodes=JSON.parse(localStorage.getItem(DOCUMENT_PREFIX+activeDate)||'null');
    documentNodes=validNodes(storedNodes)?storedNodes:canonicalNodesFromTasks(tasks)
  }catch{documentNodes=canonicalNodesFromTasks(tasks)}
  ensureTaskNodes();render()
}
function save(){
  ensureTaskNodes();
  localStorage.setItem(STORAGE_PREFIX+activeDate,JSON.stringify(tasks));
  localStorage.setItem(DOCUMENT_PREFIX+activeDate,JSON.stringify(documentNodes));
  render()
}
function toast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1600)
}

function taskToMarkdown(t){
  const s=stateOf(t),mark=s==='done'?'x':s==='running'?'/':s==='deferred'?'>':' ';
  const keepPlain=t.hadCheckbox===false&&s==='todo';
  let line=`${t.bullet||'-'} ${keepPlain?'':`[${mark}] `}${t.title}`;
  if(t.estimate>0)line+=` (${t.estimate}m)`;
  if(t.start||t.end){
    const dur=t.actualMin||(t.start&&t.end?elapsed(t.start,t.end):0);
    line+=` 【${t.start||''}-${t.end||''}${dur?` / ${dur}m`:''}】`
  }
  if(t.skipDate)line+=` [SKIP ${t.skipDate}]`;
  return line
}
function exportMarkdown(){
  ensureTaskNodes();
  const byId=new Map(tasks.map(t=>[t.id,t])),lines=[];
  for(const node of documentNodes){
    if(node.type==='raw'){lines.push(node.text);continue}
    const t=byId.get(node.id);if(!t)continue;
    lines.push(taskToMarkdown(t),...t.childLines)
  }
  return lines.join('\n')
}
function parseTaskLine(raw,currentSection){
  const m=raw.match(/^([-*+])\s+(?:\[([^\]])\]\s+)?(.*)$/);
  if(!m)return null;
  let body=m[3].trim();const mark=m[2]===undefined?' ':m[2];

  let skipDate='';
  const sm=body.match(/\s*\[SKIP(?:\s+(\d{4}-\d{2}-\d{2}|\d{4}))?\]\s*$/i);
  if(sm){skipDate=sm[1]||'';body=body.slice(0,sm.index).trimEnd()}

  let start='',end='',actualMin=0;
  const tm=body.match(/\s*【\s*(\d{1,2}:\d{2})?\s*[-－ー]\s*(\d{1,2}:\d{2})?\s*(?:\/\s*(\d+)m)?\s*】\s*$/);
  if(tm){
    start=tm[1]||'';end=tm[2]||'';actualMin=Number(tm[3])||0;
    body=body.slice(0,tm.index).trimEnd()
  }

  let estimate=0,estimateStyle='paren',estimateGap=' ';
  const hm=body.match(/(\s*)⏳\s*(\d+)m\s*$/);
  if(hm){
    estimate=Number(hm[2])||0;estimateStyle='hourglass';estimateGap=hm[1]||' ';
    body=body.slice(0,hm.index).trimEnd()
  }else{
    const pm=body.match(/(\s*)\((\d+)m\)\s*$/);
    if(pm){
      estimate=Number(pm[2])||0;estimateStyle='paren';estimateGap=pm[1]||'';
      body=body.slice(0,pm.index).trimEnd()
    }
  }

  return normalizeTask({
    title:body,estimate,start,end,actualMin,
    completed:String(mark).toLowerCase()==='x',
    deferred:mark==='>'||mark==='<',
    skipDate,section:currentSection,bullet:m[1],
    hadCheckbox:m[2]!==undefined,estimateStyle,estimateGap,childLines:[]
  })
}
function parseMarkdown(text){
  const result=[],nodes=[];let currentSection='',lastTask=null;
  for(const raw of String(text||'').split(/\r?\n/)){
    const heading=raw.match(/^\s*##\s+(.+?)\s*$/);
    if(heading){
      currentSection=heading[1].trim();nodes.push({type:'raw',text:raw});lastTask=null;continue
    }
    if(/^\s+\S/.test(raw)&&lastTask){lastTask.childLines.push(raw);continue}
    const task=parseTaskLine(raw,currentSection);
    if(task){result.push(task);nodes.push({type:'task',id:task.id});lastTask=task;continue}
    nodes.push({type:'raw',text:raw});
    if(raw.trim()!=='')lastTask=null
  }
  return{tasks:result,nodes}
}
function insertTaskNode(task,nodes=documentNodes,taskList=tasks){
  let insertAt=-1;
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];if(n.type!=='task')continue;
    const peer=taskList.find(t=>t.id===n.id);
    if(peer&&peer.section===task.section){insertAt=i+1;break}
  }
  if(insertAt<0&&task.section){
    for(let i=nodes.length-1;i>=0;i--){
      const n=nodes[i];
      if(n.type==='raw'&&n.text.trim()===`## ${task.section}`){insertAt=i+1;break}
    }
  }
  if(insertAt<0){
    if(task.section){
      if(nodes.length&&!(nodes[nodes.length-1].type==='raw'&&nodes[nodes.length-1].text===''))nodes.push({type:'raw',text:''});
      nodes.push({type:'raw',text:`## ${task.section}`})
    }
    insertAt=nodes.length
  }
  nodes.splice(insertAt,0,{type:'task',id:task.id})
}
function removeTaskNode(id,nodes=documentNodes){const i=nodes.findIndex(n=>n.type==='task'&&n.id===id);if(i>=0)nodes.splice(i,1)}
function swapTaskNodes(idA,idB){
  const a=documentNodes.findIndex(n=>n.type==='task'&&n.id===idA),b=documentNodes.findIndex(n=>n.type==='task'&&n.id===idB);
  if(a>=0&&b>=0)[documentNodes[a],documentNodes[b]]=[documentNodes[b],documentNodes[a]]
}
function readStoredDate(date){
  let dateTasks=[];
  try{
    const stored=JSON.parse(localStorage.getItem(STORAGE_PREFIX+date)||'[]');
    dateTasks=(Array.isArray(stored)?stored:stored&&Array.isArray(stored.tasks)?stored.tasks:[]).map(normalizeTask)
  }catch{}
  let nodes=[];
  try{
    const storedNodes=JSON.parse(localStorage.getItem(DOCUMENT_PREFIX+date)||'null');
    nodes=validNodes(storedNodes)?storedNodes:canonicalNodesFromTasks(dateTasks)
  }catch{nodes=canonicalNodesFromTasks(dateTasks)}
  return{tasks:dateTasks,nodes}
}
function writeStoredDate(date,state){
  localStorage.setItem(STORAGE_PREFIX+date,JSON.stringify(state.tasks));
  localStorage.setItem(DOCUMENT_PREFIX+date,JSON.stringify(state.nodes))
}

function endRunning(at){
  for(const t of tasks){
    if(stateOf(t)==='running'){
      t.end=at;t.actualMin=elapsed(t.start,t.end);t.completed=true
    }
  }
}
function latestEnd(){
  let latest='';
  for(const t of tasks){if(t.end&&(!latest||minutesOf(t.end)>minutesOf(latest)))latest=t.end}
  return latest
}
function startTask(id,usePrevious=false){
  const t=tasks.find(x=>x.id===id);
  if(!t||stateOf(t)==='done')return;
  const at=(usePrevious&&latestEnd())||nowTime();
  endRunning(at);
  t.completed=false;t.deferred=false;t.skipDate='';t.start=at;t.end='';t.actualMin=0;
  save()
}
function endTask(id){
  const t=tasks.find(x=>x.id===id);
  if(!t||stateOf(t)!=='running')return;
  t.end=nowTime();t.actualMin=elapsed(t.start,t.end);t.completed=true;save()
}
function resetTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.start='';t.end='';t.actualMin=0;t.completed=false;t.deferred=false;t.skipDate='';save()
}
function deferTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.start='';t.end='';t.actualMin=0;t.completed=false;t.deferred=!t.deferred;t.skipDate='';save()
}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);removeTaskNode(id);save()}
function moveTask(id,delta){
  const i=tasks.findIndex(t=>t.id===id);if(i<0)return;
  const section=tasks[i].section;
  const peers=tasks.map((t,idx)=>({t,idx})).filter(x=>x.t.section===section);
  const p=peers.findIndex(x=>x.idx===i),target=peers[p+delta];if(!target)return;
  const otherId=tasks[target.idx].id;
  [tasks[i],tasks[target.idx]]=[tasks[target.idx],tasks[i]];
  swapTaskNodes(id,otherId);save()
}
function moveTomorrow(id){
  const i=tasks.findIndex(t=>t.id===id);if(i<0)return;
  const target=shiftDate(activeDate,1);
  const moved=normalizeTask({...tasks[i],id:uid(),start:'',end:'',actualMin:0,completed:false,deferred:false,skipDate:''});
  const targetState=readStoredDate(target);
  targetState.tasks.push(moved);insertTaskNode(moved,targetState.nodes,targetState.tasks);
  writeStoredDate(target,targetState);
  tasks.splice(i,1);removeTaskNode(id);save();toast(`${target} へ移動しました`)
}

function statusLabel(t){
  const s=stateOf(t);
  return s==='running'?'[/]':s==='done'?'[x]':s==='deferred'?'[>]':'[ ]'
}
function span(text){const e=document.createElement('span');e.textContent=text;return e}
function btn(text,fn,disabled=false,cls=''){
  const b=document.createElement('button');b.textContent=text;b.onclick=fn;b.disabled=disabled;
  if(cls)b.classList.add(...cls.split(/\s+/).filter(Boolean));
  return b
}
function createTaskRow(t,index){
  const s=stateOf(t),row=document.createElement('article');
  row.className=`task ${s}`;

  const status=document.createElement('button');
  status.className='status-btn';
  status.textContent=statusLabel(t);
  status.title=s==='todo'?'開始':s==='running'?'終了':s==='done'?'保留にする':'リセット';
  status.onclick=()=>{
    if(s==='todo')startTask(t.id);
    else if(s==='running')endTask(t.id);
    else if(s==='done')deferTask(t.id);
    else resetTask(t.id)
  };

  const main=document.createElement('div');main.className='task-main';
  const title=document.createElement('input');title.className='task-title';title.value=t.title;
  title.onchange=()=>{t.title=title.value.trim();save()};

  const meta=document.createElement('div');meta.className='task-meta';
  if(t.estimate)meta.append(span(`見積 ${t.estimate}m`));
  if(t.start)meta.append(span(`開始 ${t.start}`));
  if(t.end)meta.append(span(`終了 ${t.end}`));
  if(t.start&&t.end)meta.append(span(`実績 ${t.actualMin||elapsed(t.start,t.end)}m`));
  if(t.deferred)meta.append(span('保留'));

  const actions=document.createElement('div');actions.className='task-actions';
  if(s==='todo'||s==='deferred'){
    actions.append(
      btn('開始',()=>startTask(t.id),false,'primary-action'),
      btn('前回から',()=>startTask(t.id,true))
    )
  }
  if(s==='running')actions.append(btn('終了',()=>endTask(t.id),false,'primary-action'));

  const sameSection=tasks.filter(x=>x.section===t.section),sectionIndex=sameSection.findIndex(x=>x.id===t.id);
  actions.append(
    btn('↑',()=>moveTask(t.id,-1),sectionIndex===0,'move-action'),
    btn('↓',()=>moveTask(t.id,1),sectionIndex===sameSection.length-1,'move-action'),
    btn('削除',()=>deleteTask(t.id),false,'delete-action')
  );

  const more=document.createElement('details');more.className='task-more';
  const summary=document.createElement('summary');summary.textContent='その他';
  const menu=document.createElement('div');menu.className='task-more-menu';
  if(s!=='todo')menu.append(btn('リセット',()=>resetTask(t.id)));
  menu.append(
    btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),
    btn('翌日',()=>moveTomorrow(t.id))
  );
  more.append(summary,menu);
  actions.append(more);

  main.append(title,meta,actions);row.append(status,main);
  return row
}
function renderSectionMenu(){
  const menu=$('sectionMenu'),names=sectionNames(),hiddenCount=names.filter(n=>hiddenSections.has(n)).length;
  $('sectionBtn').textContent=hiddenCount?`セクション (${hiddenCount}非表示)`:'セクション';
  menu.innerHTML='';
  const title=document.createElement('div');title.className='section-menu-title';
  title.textContent=names.length?'表示するセクション':'セクションはありません';menu.append(title);
  if(names.length){
    const list=document.createElement('div');list.className='section-menu-list';
    for(const name of names){
      const hidden=hiddenSections.has(name),b=document.createElement('button');
      b.className=hidden?'hidden-section':'';
      b.innerHTML=`<span>${hidden?'○':'✓'} ${escapeHtml(name)}</span><span>${hidden?'表示':'非表示'}</span>`;
      b.onclick=()=>toggleSection(name);list.append(b)
    }
    menu.append(list);
    const all=document.createElement('button');all.className='all-show';all.textContent='すべて表示';all.onclick=showAllSections;menu.append(all)
  }
}
function escapeHtml(s){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}

function render(){
  $('dateBtn').innerHTML=`${activeDate}${activeDate===todayStr()?'<span class="today-mark">TODAY</span>':''}`;
  $('doneToggleBtn').textContent=hideDone?'完了を表示':'完了を非表示';
  $('doneToggleBtn').classList.toggle('active',hideDone);

  const root=$('tasks');root.innerHTML='';
  let visibleCount=0,currentSectionMarker=null,currentBlock=root;
  tasks.forEach((t,index)=>{
    if(hideDone&&stateOf(t)==='done')return;
    if(t.section&&hiddenSections.has(t.section))return;
    if(t.section!==currentSectionMarker){
      currentSectionMarker=t.section;
      if(t.section){
        const block=document.createElement('section');block.className='section-block';
        const head=document.createElement('div');head.className='section-head';
        const title=document.createElement('div');title.className='section-title';title.textContent=t.section;
        const hide=document.createElement('button');hide.textContent='非表示';hide.onclick=()=>hideSection(t.section);
        head.append(title,hide);block.append(head);root.append(block);currentBlock=block
      }else currentBlock=root
    }
    currentBlock.append(createTaskRow(t,index));visibleCount++
  });

  if(!tasks.length)root.innerHTML='<div class="empty">タスクはありません。上から追加できます。</div>';
  else if(!visibleCount)root.innerHTML=hideDone
    ?'<div class="empty">完了済みのタスクは非表示です。「完了を表示」で確認できます。</div>'
    :'<div class="empty">表示対象のタスクがありません。セクション表示設定を確認してください。</div>';

  const done=tasks.filter(t=>stateOf(t)==='done').length;
  const total=tasks.length;
  const recorded=tasks.filter(t=>t.start&&t.end).reduce((a,t)=>a+(t.actualMin||elapsed(t.start,t.end)),0);
  const remain=tasks.filter(t=>stateOf(t)!=='done'&&stateOf(t)!=='deferred').reduce((a,t)=>a+(Number(t.estimate)||0),0);
  const running=tasks.find(t=>stateOf(t)==='running');

  $('doneCount').textContent=`${done}/${total}`;
  $('progressPct').textContent=total?`${Math.round(done/total*100)}%`:'0%';
  $('recordedMin').textContent=`${recorded}m`;
  $('remainingMin').textContent=`${remain}m`;

  $('currentTitle').textContent=running?running.title:'待機中';
  $('currentTime').textContent=running?`開始 ${running.start}`:'実行中のタスクはありません';
  $('currentEndBtn').hidden=!running;
  $('currentEndBtn').onclick=running?()=>endTask(running.id):null;

  $('markdownBox').value=exportMarkdown();
  renderSectionMenu();
  updateLiveDisplay()
}
function updateLiveDisplay(){
  $('nowClock').textContent=nowTimeSeconds();
  const running=tasks.find(t=>stateOf(t)==='running');
  if(running){
    const seconds=liveElapsedSeconds(running.start);
    $('currentElapsed').textContent=seconds===null?'--:--:--':`経過 ${formatDurationSeconds(seconds)}`
  }else{
    $('currentElapsed').textContent='--:--:--'
  }
}
function addNew(){
  const title=$('newTitle').value.trim();if(!title)return;
  const section=tasks.length?tasks[tasks.length-1].section:'';
  const task=normalizeTask({title,estimate:Number($('newEstimate').value)||0,section});
  tasks.push(task);insertTaskNode(task);
  $('newTitle').value='';$('newEstimate').value='';
  save();$('newTitle').focus()
}

$('addTask').onclick=addNew;
$('newTitle').addEventListener('keydown',e=>{if(e.key==='Enter')addNew()});
$('newEstimate').addEventListener('keydown',e=>{if(e.key==='Enter')addNew()});
$('prevDay').onclick=()=>{activeDate=shiftDate(activeDate,-1);load()};
$('nextDay').onclick=()=>{activeDate=shiftDate(activeDate,1);load()};
$('todayBtn').onclick=()=>{activeDate=todayStr();load()};
$('dateBtn').onclick=()=>{
  const v=prompt('日付を YYYY-MM-DD で入力',activeDate);
  if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){activeDate=v;load()}
};
$('carryBtn').onclick=()=>{
  const prev=shiftDate(activeDate,-1),prevState=readStoredDate(prev);
  const carry=prevState.tasks.filter(t=>stateOf(t)!=='done').map(t=>normalizeTask({...t,id:uid(),start:'',end:'',actualMin:0,completed:false,deferred:false,skipDate:''}));
  if(!carry.length){toast('持ち越すタスクはありません');return}
  for(const t of carry){tasks.push(t);insertTaskNode(t)}
  save();toast(`${carry.length}件を持ち越しました`)
};
$('doneToggleBtn').onclick=()=>{
  hideDone=!hideDone;localStorage.setItem(HIDE_DONE_KEY,hideDone?'1':'0');render();
  toast(hideDone?'完了済みタスクを非表示にしました':'完了済みタスクを表示しました')
};
$('sectionBtn').onclick=e=>{e.stopPropagation();$('sectionMenu').classList.toggle('open')};
document.addEventListener('click',e=>{
  const menu=$('sectionMenu');
  if(!menu.contains(e.target)&&e.target!==$('sectionBtn'))menu.classList.remove('open')
});
$('copyMdBtn').onclick=async()=>{
  const text=exportMarkdown();
  try{await navigator.clipboard.writeText(text);toast('Markdownをコピーしました')}
  catch{$('markdownBox').value=text;$('markdownBox').select();document.execCommand('copy');toast('Markdownをコピーしました')}
};
$('downloadMdBtn').onclick=()=>{
  const blob=new Blob([exportMarkdown()+'\n'],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`${activeDate}.md`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000)
};
$('importMdBtn').onclick=()=>{
  const parsed=parseMarkdown($('markdownBox').value);
  if(!parsed.tasks.length){toast('取り込めるタスク行がありません');return}
  if(tasks.length&&!confirm('現在日のタスクをMarkdown内容で置き換えますか？'))return;
  tasks=parsed.tasks;documentNodes=parsed.nodes;save();toast(`${tasks.length}件を取り込みました`)
};

setInterval(updateLiveDisplay,1000);
load();
})();
</script>
</body>
</html>
