<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TaskLiner / taskchute-line</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f5f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}#app{display:block;width:100%;height:100%;border:0}.sync-open{position:fixed;right:14px;bottom:14px;z-index:20;border:1px solid #cfd3cd;background:#fff;color:#20211f;border-radius:999px;width:44px;height:44px;padding:0;font-size:21px;line-height:1;font-weight:700;box-shadow:0 6px 22px rgba(0,0,0,.14)}.save-tools{position:fixed;right:14px;top:10px;z-index:20;display:flex;align-items:center;gap:6px}.auto-save-state{padding:5px 9px;border:1px solid #d9ddd7;background:rgba(255,255,255,.9);color:#6b7069;border-radius:999px;font-size:11px;line-height:1;backdrop-filter:blur(8px);pointer-events:none}.quick-save{border:1px solid #d9ddd7;background:rgba(255,255,255,.92);color:#2f5d50;border-radius:999px;padding:5px 9px;font-size:11px;line-height:1;font-weight:700;backdrop-filter:blur(8px);cursor:pointer}.auto-save-state.dirty{color:#9a682f}.auto-save-state.saving{color:#2f5d50}.auto-save-state.error{color:#b24b45}.pull-indicator{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));z-index:40;transform:translate(-50%,-48px);opacity:0;pointer-events:none;border:1px solid #d9ddd7;background:rgba(255,255,255,.94);color:#2f5d50;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:750;line-height:1;box-shadow:0 5px 18px rgba(0,0,0,.12);backdrop-filter:blur(8px);transition:transform .16s ease,opacity .16s ease}.pull-indicator.visible{opacity:1}.pull-indicator.ready{color:#1f6c55}.sync-panel{position:fixed;z-index:30;right:14px;bottom:66px;width:min(390px,calc(100vw - 28px));max-height:calc(100vh - 92px);overflow:auto;background:#fff;color:#20211f;border:1px solid #d9ddd7;border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none}.sync-panel.open{display:block}.sync-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sync-head b{font-size:15px}.sync-head button{border:0;background:transparent;font-size:20px}.settings-section-title{font-size:12px;font-weight:750;margin:2px 0 10px;color:#60655e}.sync-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sync-field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.sync-field.full{grid-column:1/-1}.sync-field label{font-size:11px;color:#6b7069}.sync-field input{width:100%;box-sizing:border-box;border:1px solid #d9ddd7;background:#f7f8f5;color:#20211f;border-radius:9px;padding:8px 9px;font:inherit;font-size:13px}.sync-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.sync-actions button{border:1px solid #d9ddd7;background:#f7f8f5;color:#20211f;border-radius:9px;padding:8px 10px;font-weight:650}.sync-actions .primary{background:#2f5d50;color:#fff;border-color:#2f5d50}.sync-status{font-size:12px;color:#60655e;margin-top:10px;min-height:18px}.sync-note{font-size:11px;line-height:1.5;color:#777d75;margin-top:10px;padding-top:9px;border-top:1px solid #eceeea}.warn{color:#9a4c2f;font-weight:650}.ok{color:#2f6d55;font-weight:650}@media(prefers-color-scheme:dark){html,body{background:#151714}.sync-open,.sync-panel{background:#1d201c;color:#eceee8;border-color:#343931}.auto-save-state,.quick-save,.pull-indicator{background:rgba(29,32,28,.92);color:#a1a59c;border-color:#343931}.pull-indicator.ready{color:#8fc0ae}.auto-save-state.dirty{color:#d8b477}.auto-save-state.saving{color:#8fc0ae}.auto-save-state.error{color:#ef9393}.sync-field input,.sync-actions button{background:#151714;color:#eceee8;border-color:#343931}.sync-field label,.sync-status,.sync-note,.settings-section-title{color:#a1a59c}.sync-note{border-color:#343931}.sync-actions .primary{background:#527d6e;color:#fff}.warn{color:#e6a17f}.ok{color:#8fc0ae}}@media(max-width:520px){.sync-panel{right:8px;bottom:62px;width:calc(100vw - 16px);max-height:72vh}.sync-open{right:10px;bottom:10px}.save-tools{right:10px;top:8px}.sync-grid{grid-template-columns:1fr}.sync-field.full{grid-column:auto}}
</style>
</head>
<body>
<iframe id="app" src="./taskliner_taskchute-line.html" title="TaskLiner"></iframe>
<div id="pullIndicator" class="pull-indicator">↓ Pull</div>
<div class="save-tools"><button id="quickPull" class="quick-save" type="button" title="GitHubから現在日を読み込む">pull</button><button id="quickSave" class="quick-save" type="button" title="現在日の変更をGitHubへ保存する">sync</button><div id="autoSaveState" class="auto-save-state">保存済み</div></div>
<button id="syncOpen" class="sync-open" aria-label="設定を開く" title="設定">⚙</button>
<section id="syncPanel" class="sync-panel" aria-label="TaskLiner設定">
  <div class="sync-head"><b>設定</b><button id="syncClose" aria-label="閉じる">×</button></div>
  <div class="settings-section-title">GitHub同期</div>
  <div class="sync-grid">
    <div class="sync-field full"><label>Fine-grained token</label><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_... または ghp_..."></div>
    <div class="sync-field full"><label>Repository (owner/repo)</label><input id="ghRepo" value="plzsayyes3/mynotebook"></div>
    <div class="sync-field"><label>Branch</label><input id="ghBranch" value="main"></div>
    <div class="sync-field"><label>Folder</label><input id="ghFolder" value="09_taskchute"></div>
  </div>
  <div class="sync-actions">
    <button id="ghCheck">接続確認</button>
    <button id="ghLoad">GitHubから読込</button>
    <button id="ghSave" class="primary">GitHubへ保存</button>
    <button id="ghForget">Tokenを消去</button>
  </div>
  <div id="ghStatus" class="sync-status">未接続</div>
  <div class="sync-note">Tokenはこのブラウザの <code>localStorage</code> に保存し、リポジトリやHTMLには書き込みません。必要権限は保存先Repositoryの <b>Contents: Read and write</b> です。<br><span id="repoPrivacy">RepositoryとBranchの状態は「接続確認」で確認します。</span></div>
</section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),frame=$('app'),panel=$('syncPanel');
const CONFIG_KEY='taskliner_github_sync_config_v1',TOKEN_KEY='taskliner_github_sync_token_v1',DIRTY_KEY='taskliner_github_dirty_dates_v1',SHA_KEY='taskliner_github_known_sha_v1';
const TASK_PREFIX='taskliner_taskchute_line_v1:',DOCUMENT_PREFIX='taskliner_taskchute_line_document_v1:';
const AUTO_SAVE_DELAY=60*1000,PULL_THRESHOLD=70,PULL_MAX=120;
const knownSha=loadKnownSha();
let dirtyDates=loadDirtyDates(),dirtyVersion=new Map(),autoTimer=null,saveInFlight=null,navigationPending=false,suppressDirty=false,startupPullAttempted=false,pullBusy=false;const skipDirtyDates=new Set();
function status(text,isError=false){const el=$('ghStatus');el.textContent=text;el.style.color=isError?'#b24b45':''}
function saveState(text,kind=''){const el=$('autoSaveState');el.textContent=text;el.className=`auto-save-state${kind?` ${kind}`:''}`}
function config(){return{repo:$('ghRepo').value.trim(),branch:$('ghBranch').value.trim()||'main',folder:$('ghFolder').value.trim().replace(/^\/+|\/+$/g,''),token:$('ghToken').value.trim()}}
function saveConfig(){const c=config();localStorage.setItem(CONFIG_KEY,JSON.stringify({repo:c.repo,branch:c.branch,folder:c.folder}));if(c.token)localStorage.setItem(TOKEN_KEY,c.token)}
function restoreConfig(){try{const c=JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}');if(c.repo)$('ghRepo').value=c.repo;if(c.branch)$('ghBranch').value=c.branch;if(c.folder!==undefined)$('ghFolder').value=c.folder}catch{}$('ghToken').value=localStorage.getItem(TOKEN_KEY)||''}
function loadDirtyDates(){try{return new Set(JSON.parse(localStorage.getItem(DIRTY_KEY)||'[]'))}catch{return new Set()}}
function persistDirtyDates(){localStorage.setItem(DIRTY_KEY,JSON.stringify([...dirtyDates]))}
function loadKnownSha(){try{return new Map(Object.entries(JSON.parse(localStorage.getItem(SHA_KEY)||'{}')))}catch{return new Map()}}
function rememberSha(key,sha){if(!key||!sha)return;knownSha.set(key,sha);localStorage.setItem(SHA_KEY,JSON.stringify(Object.fromEntries(knownSha)))}
function appDocument(){try{const root=frame.contentDocument;if(!root)return null;const nested=root.querySelector('iframe');return nested?.contentDocument||root}catch{return null}}
function appWindow(){try{const root=frame.contentDocument;if(!root)return null;const nested=root.querySelector('iframe');return nested?.contentWindow||frame.contentWindow}catch{return null}}
function activeDate(){try{return(appDocument()?.getElementById('dateBtn')?.textContent||'').trim().slice(0,10)}catch{return''}}
function markdownBox(){try{return appDocument()?.getElementById('markdownBox')||null}catch{return null}}
function importButton(){try{return appDocument()?.getElementById('importMdBtn')||null}catch{return null}}
function recognizedSections(){try{return appDocument()?.querySelectorAll('#sectionMenu .section-menu-list button').length||0}catch{return 0}}
function filePath(date=activeDate()){const c=config();if(!date)throw new Error('日付を取得できません');return c.folder?`${c.folder}/${date}.md`:`${date}.md`}
function splitRepo(repo){const p=repo.split('/').filter(Boolean);if(p.length!==2)throw new Error('Repositoryは owner/repo 形式で入力してください');return p}
function headers(){const token=config().token;if(!token)throw new Error('Tokenを入力してください');return{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
function toBase64(text){const bytes=new TextEncoder().encode(text);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}
function fromBase64(text){const binary=atob(String(text||'').replace(/\n/g,'')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function endpoint(path=''){const c=config(),[owner,repo]=splitRepo(c.repo);return`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}${path}`}
async function fetchJson(path=''){const r=await fetch(endpoint(path),{headers:headers()});if(!r.ok){const d=await r.json().catch(()=>({}));const e=new Error(d.message||`GitHub API ${r.status}`);e.status=r.status;throw e}return r.json()}
async function repoMeta(){return fetchJson('')}
async function ensureBranch(){const branch=config().branch;try{return await fetchJson(`/branches/${encodeURIComponent(branch)}`)}catch(e){if(e.status===404)throw new Error(`Branch「${branch}」がありません。Branch名かTokenのRepositoryアクセス範囲を確認してください。`);throw e}}
async function getRemote(path){const c=config();const url=endpoint(`/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(c.branch)}`);const r=await fetch(url,{headers:headers()});if(r.status===404)return null;if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||`GitHub API ${r.status}`)}return r.json()}
function showPrivacy(meta){const el=$('repoPrivacy');if(meta.private){el.className='ok';el.textContent='保存先は private repository です。'}else{el.className='warn';el.textContent='保存先は public repository です。タスク内容も公開されます。'}}
function refreshSaveState(){const date=activeDate();if(!date)return;if(dirtyDates.has(date)){saveState('未保存','dirty');scheduleAutoSave()}else saveState('保存済み')}
function scheduleAutoSave(){clearTimeout(autoTimer);const date=activeDate();if(!date||!dirtyDates.has(date))return;autoTimer=setTimeout(()=>{if(document.visibilityState==='visible')saveRemote({interactive:false,reason:'idle'})},AUTO_SAVE_DELAY)}
function markDirty(date){if(suppressDirty||!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return;dirtyDates.add(date);dirtyVersion.set(date,(dirtyVersion.get(date)||0)+1);persistDirtyDates();if(date===activeDate()){saveState('未保存','dirty');scheduleAutoSave()}}
function markClean(date){dirtyDates.delete(date);persistDirtyDates();if(date===activeDate()){clearTimeout(autoTimer);saveState('保存済み')}}
async function check(){saveConfig();status('Repository / Branch を確認中…');try{const meta=await repoMeta();await ensureBranch();showPrivacy(meta);status(`接続OK: ${meta.full_name} / ${config().branch} / ${meta.private?'private':'public'}`)}catch(e){$('repoPrivacy').className='';$('repoPrivacy').textContent='接続確認に失敗しています。';status(`接続失敗: ${e.message}`,true)}}
async function loadRemote(){saveConfig();const date=activeDate();if(!date)return false;if(dirtyDates.has(date)&&!confirm('未保存の変更があります。破棄してGitHubからpullしますか？'))return false;status('GitHubから読込中…');try{await ensureBranch();const path=filePath(date),d=await getRemote(path);if(!d){status(`${path} はまだありません`);return false}if(!d.content)throw new Error('ファイル内容を取得できません');const box=markdownBox(),button=importButton(),win=appWindow();if(!box||!button||!win)throw new Error('TaskLiner画面へ接続できません');const text=fromBase64(d.content);box.value=text;rememberSha(`${config().repo}|${config().branch}|${path}`,d.sha);skipDirtyDates.add(date);const originalConfirm=win.confirm;suppressDirty=true;win.confirm=()=>true;try{button.click()}finally{win.confirm=originalConfirm;suppressDirty=false}const sections=recognizedSections(),rawSections=(text.match(/^\s*##\s+.+$/gm)||[]).length;if(rawSections>0&&sections===0)throw new Error(`Markdownには${rawSections}個のセクションがありますが、画面側で認識できませんでした`);markClean(date);status(`${path} を読み込みました（${sections}セクション認識）`);return true}catch(e){status(`読込失敗: ${e.message}`,true);saveState('読込失敗','error');return false}}
async function performSave({interactive=true}={}){saveConfig();const date=activeDate(),box=markdownBox();if(!box)throw new Error('TaskLiner画面へ接続できません');const path=filePath(date),key=`${config().repo}|${config().branch}|${path}`,version=dirtyVersion.get(date)||0;saveState('保存中','saving');status('GitHubへ保存中…');await ensureBranch();const current=await getRemote(path),known=knownSha.get(key);if(current?.sha&&known&&current.sha!==known)throw new Error('GitHub側の内容が更新されています。先にpullしてください。');const body={message:`TaskLiner sync: ${date}`,content:toBase64(box.value),branch:config().branch};if(current?.sha)body.sha=current.sha;const r=await fetch(endpoint(`/contents/${path.split('/').map(encodeURIComponent).join('/')}`),{method:'PUT',headers:headers(),body:JSON.stringify(body)});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||`GitHub API ${r.status}`)}const saved=await r.json();rememberSha(key,saved.content?.sha||'');if((dirtyVersion.get(date)||0)===version)markClean(date);else{dirtyDates.add(date);persistDirtyDates();saveState('未保存','dirty');scheduleAutoSave()}status(`${path} を保存しました`);return true}
async function saveRemote(opts={}){if(saveInFlight)return saveInFlight;saveInFlight=performSave(opts).catch(e=>{status(`保存失敗: ${e.message}`,true);saveState('保存失敗','error');return false}).finally(()=>{saveInFlight=null});return saveInFlight}
async function startupPull(attempt=0){if(startupPullAttempted)return;const c=config();if(!c.token||!c.repo)return;const date=activeDate();if(!date){if(attempt<60)setTimeout(()=>startupPull(attempt+1),200);return}startupPullAttempted=true;if(dirtyDates.has(date))return;await loadRemote()}
function open(){panel.classList.add('open')}function close(){panel.classList.remove('open')}
function resetPullIndicator(){const el=$('pullIndicator');el.classList.remove('visible','ready');el.style.transform='translate(-50%,-48px)';el.textContent='↓ Pull'}
function showPullProgress(dy){const el=$('pullIndicator');const p=Math.max(0,Math.min(1,(dy-PULL_THRESHOLD)/(PULL_MAX-PULL_THRESHOLD)));el.classList.add('visible');el.classList.toggle('ready',p>=1);el.style.transform=`translate(-50%,${-48+54*p}px)`;el.textContent=p>=1?'離してPull':'↓ Pull'}
function installPullGesture(){let startY=0,tracking=false,eligible=false;document.addEventListener('touchstart',e=>{if(pullBusy||panel.classList.contains('open')||window.scrollY>2||e.touches.length!==1)return;startY=e.touches[0].clientY;tracking=true;eligible=true},{passive:true});document.addEventListener('touchmove',e=>{if(!tracking||!eligible||e.touches.length!==1)return;const dy=e.touches[0].clientY-startY;if(dy>0)showPullProgress(dy);else resetPullIndicator()},{passive:true});document.addEventListener('touchend',async e=>{if(!tracking)return;const y=e.changedTouches?.[0]?.clientY??startY,dy=y-startY,run=eligible&&dy>=PULL_MAX;tracking=false;eligible=false;resetPullIndicator();if(run){pullBusy=true;try{await loadRemote()}finally{pullBusy=false}}},{passive:true});document.addEventListener('touchcancel',()=>{tracking=false;eligible=false;resetPullIndicator()},{passive:true})}
function handleMessage(e){const msg=e.data;if(!msg||msg.source!=='taskliner')return;if(msg.type==='tasks-updated'){const date=msg.date||activeDate();if(skipDirtyDates.delete(date)){}else markDirty(date)}if(msg.type==='navigation-request'){const from=msg.fromDate||activeDate();if(!dirtyDates.has(from)){appWindow()?.postMessage({source:'taskliner-host',type:'navigation-continue',targetDate:msg.targetDate},'*');return}if(navigationPending)return;navigationPending=true;saveRemote({interactive:false,reason:'navigation'}).then(ok=>{if(ok)appWindow()?.postMessage({source:'taskliner-host',type:'navigation-continue',targetDate:msg.targetDate},'*')}).finally(()=>{navigationPending=false})}if(msg.type==='date-changed'){refreshSaveState();if(!dirtyDates.has(activeDate()))loadRemote()}}
restoreConfig();$('syncOpen').onclick=open;$('syncClose').onclick=close;$('ghCheck').onclick=check;$('ghLoad').onclick=loadRemote;$('ghSave').onclick=()=>saveRemote({interactive:true});$('quickPull').onclick=loadRemote;$('quickSave').onclick=()=>saveRemote({interactive:true});$('ghForget').onclick=()=>{localStorage.removeItem(TOKEN_KEY);$('ghToken').value='';status('Tokenを消去しました')};window.addEventListener('message',handleMessage);frame.addEventListener('load',()=>{refreshSaveState();startupPull()});installPullGesture();refreshSaveState();
})();
</script>
</body>
</html>
