name: One-off task row ETA
on:
  push:
    paths:
      - '.github/workflows/one-off-show-eta-in-task-row.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show ETA beside start time in running task row
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          old="if(t.estimate)meta.append(span(`見積 ${t.estimate}m`));if(t.start)meta.append(span(`開始 ${t.start}`));if(t.end)meta.append(span(`終了 ${t.end}`));"
          new="if(t.estimate)meta.append(span(`見積 ${t.estimate}m`));if(t.start){meta.append(span(`開始 ${t.start}`));const expected=t.expectedEnd||(t.estimate>0?addMinutesToClock(t.start,t.estimate):'');if(s==='running'&&expected)meta.append(span(`終了見込 ${expected}`))}if(t.end)meta.append(span(`終了 ${t.end}`));"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Show expected end in running task row'
          git push
