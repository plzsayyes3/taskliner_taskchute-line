name: Enable Wiki Preview

on:
  push:
    paths:
      - '.github/workflows/enable-wiki-preview.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add WikiLink preview loader
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          marker = '<script src="./wiki-preview.js"></script>'
          text = index.read_text(encoding='utf-8')
          if marker not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no </body>')
              index.write_text(text.replace('</body>', marker + '\n</body>', 1), encoding='utf-8')
          Path('.github/workflows/enable-wiki-preview.yml').unlink()
          PY
      - name: Commit loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable WikiLink preview"
          git push
