name: One-off ETA estimate sync

on:
  push:
    paths:
      - '.github/workflows/one-off-sync-eta-estimate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch ETA behavior
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          old = "function changeExpectedEnd(id){const t=tasks.find(x=>x.id===id);if(!t)return;const fallback=t.expectedEnd||(t.start&&t.estimate>0?addMinutesToClock(t.start,t.estimate):nowTime());const raw=prompt('終了見込み (HH:MM / 空欄で解除)',fallback);if(raw===null)return;const value=String(raw).trim();if(!value){t.expectedEnd='';save();return}const at=normalizeClockInput(value);if(!at){toast('時刻は HH:MM で入力してください');return}t.expectedEnd=at;save()}"
          new = "function changeExpectedEnd(id){const t=tasks.find(x=>x.id===id);if(!t)return;const fallback=t.expectedEnd||(t.start&&t.estimate>0?addMinutesToClock(t.start,t.estimate):nowTime());const raw=prompt('終了見込み (HH:MM / 空欄で解除)',fallback);if(raw===null)return;const value=String(raw).trim();if(!value){t.expectedEnd='';save();return}const at=normalizeClockInput(value);if(!at){toast('時刻は HH:MM で入力してください');return}t.expectedEnd=at;if(t.start){t.estimate=elapsed(t.start,at);toast(`終了見込み ${at} / 見積 ${t.estimate}m に更新しました`)}save()}"
          assert old in s, 'changeExpectedEnd target not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('taskliner_taskchute-line.html')
          s = p.read_text(encoding='utf-8')
          old = "\"menu.append(btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))\",\n      \"menu.append(btn('見積もり変更',()=>changeEstimate(t.id)),btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))\""
          new = "\"menu.append(btn('終了見込み変更',()=>changeExpectedEnd(t.id)),btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))\",\n      \"menu.append(btn('見積もり変更',()=>changeEstimate(t.id)),btn('終了見込み変更',()=>changeExpectedEnd(t.id)),btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))\""
          assert old in s, 'wrapper menu patch target not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-sync-eta-estimate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html taskliner_taskchute-line.html .github/workflows/one-off-sync-eta-estimate.yml
          git commit -m "Sync expected end time with estimate"
          git push origin HEAD:main
