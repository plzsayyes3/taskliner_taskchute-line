name: TaskLiner tests
on:
  push:
    branches:
      - main
      - feature/taskliner-three-view
  pull_request:
    branches:
      - main
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test template-core.test.js daily-integration.test.js ui-syntax.test.js task-note-pull.test.js
