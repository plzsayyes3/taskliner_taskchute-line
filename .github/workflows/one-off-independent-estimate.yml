name: One-off independent end estimate

on:
  push:
    paths:
      - '.github/workflows/one-off-independent-estimate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')

          old = "function normalizeTask(t={}){return{id:t.id||uid(),title:String(t.title||'').trim(),estimate:Number(t.estimate)||0,start:t.start||'',end:t.end||'',actualMin:Number(t.actualMin)||0,completed:!!t.completed,deferred:!!t.deferred,skipDate:t.skipDate||'',section:String(t.section||'').trim(),bullet:['-','*','+'].includes(t.bullet)?t.bullet:'-',hadCheckbox:t.hadCheckbox!==false,estimateStyle:t.estimateStyle||'paren',estimateGap:t.estimateGap===undefined?' ':String(t.estimateGap),childLines:Array.isArray(t.childLines)?t.childLines.map(String):[]}}"
          new = "function normalizeTask(t={}){return{id:t.id||uid(),title:String(t.title||'').trim(),estimate:Number(t.estimate)||0,expectedEnd:normalizeClockInput(t.expectedEnd||''),start:t.start||'',end:t.end||'',actualMin:Number(t.actualMin)||0,completed:!!t.completed,deferred:!!t.deferred,skipDate:t.skipDate||'',section:String(t.section||'').trim(),bullet:['-','*','+'].includes(t.bullet)?t.bullet:'-',hadCheckbox:t.hadCheckbox!==false,estimateStyle:t.estimateStyle||'paren',estimateGap:t.estimateGap===undefined?' ':String(t.estimateGap),childLines:Array.isArray(t.childLines)?t.childLines.map(String):[]}}"
          assert old in s
          s = s.replace(old, new, 1)

          old = "if(t.estimate>0)line+=` (${t.estimate}m)`;if(t.start||t.end){"
          new = "if(t.estimate>0)line+=` (${t.estimate}m)`;if(t.expectedEnd)line+=` [ETA ${t.expectedEnd}]`;if(t.start||t.end){"
          assert old in s
          s = s.replace(old, new, 1)

          old = "let start='',end='',actualMin=0;const tm=body.match("
          new = "let expectedEnd='';const em=body.match(/\\s*\\[ETA\\s+(\\d{1,2}:\\d{2})\\]\\s*$/i);if(em){expectedEnd=normalizeClockInput(em[1]);body=body.slice(0,em.index).trimEnd()}let start='',end='',actualMin=0;const tm=body.match("
          assert old in s
          s = s.replace(old, new, 1)

          old = "return normalizeTask({title:body,estimate,start,end,actualMin,completed:String(mark).toLowerCase()==='x'"
          new = "return normalizeTask({title:body,estimate,expectedEnd,start,end,actualMin,completed:String(mark).toLowerCase()==='x'"
          assert old in s
          s = s.replace(old, new, 1)

          old = "function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);removeTaskNode(id);save()}"
          new = "function changeExpectedEnd(id){const t=tasks.find(x=>x.id===id);if(!t)return;const fallback=t.expectedEnd||(t.start&&t.estimate>0?addMinutesToClock(t.start,t.estimate):nowTime());const raw=prompt('終了見込み (HH:MM / 空欄で解除)',fallback);if(raw===null)return;const value=String(raw).trim();if(!value){t.expectedEnd='';save();return}const at=normalizeClockInput(value);if(!at){toast('時刻は HH:MM で入力してください');return}t.expectedEnd=at;save()}function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);removeTaskNode(id);save()}"
          assert old in s
          s = s.replace(old, new, 1)

          old = "menu.append(btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))"
          new = "menu.append(btn('終了見込み変更',()=>changeExpectedEnd(t.id)),btn(t.deferred?'保留解除':'保留',()=>deferTask(t.id)),btn('翌日',()=>moveTomorrow(t.id)))"
          assert old in s
          s = s.replace(old, new, 1)

          old = "$('currentTime').textContent=running?`開始 ${running.start}${running.estimate>0?` · 終了見込 ${addMinutesToClock(running.start,running.estimate)}`:''}`:'実行中のタスクはありません';"
          new = "$('currentTime').textContent=running?`開始 ${running.start}${(running.expectedEnd||(running.estimate>0?addMinutesToClock(running.start,running.estimate):''))?` · 終了見込 ${running.expectedEnd||(running.estimate>0?addMinutesToClock(running.start,running.estimate):'')}`:''}`:'実行中のタスクはありません';"
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-independent-estimate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html .github/workflows/one-off-independent-estimate.yml
          git commit -m "Separate estimate and expected end time"
          git push origin HEAD:main
